name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend Python
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: atti_pa
          MYSQL_USER: atti_pa
          MYSQL_PASSWORD: password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql+aiomysql://atti_pa:password@127.0.0.1:3306/atti_pa
      TEST_DATABASE_URL: mysql+aiomysql://atti_pa:password@127.0.0.1:3306/atti_pa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LibreOffice per i test di conversione
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
      - name: Installazione
        run: |
          pip install -e "./common[dev]" -e "./api[dev]" -e "./normattiva-sync[dev]" \
            -e "./verifica-worker[dev]" -e "./db-migrate[dev]" -e "./documenti[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrazioni
        run: python -m db_migrate
      - name: Test
        run: |
          for c in common db-migrate normattiva-sync verifica-worker api documenti; do
            echo "::group::$c"; (cd $c && pytest -q) || exit 1; echo "::endgroup::"
          done

  frontend:
    name: Frontend Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/src
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

  immagini:
    name: Immagine ${{ matrix.componente }}
    needs: [backend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        componente: [api, db-migrate, normattiva-sync, verifica-worker, documenti, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.componente }}/Dockerfile
          push: false
          tags: atti-pa/${{ matrix.componente }}:ci
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}
