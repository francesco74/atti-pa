# Controlli automatici di GitHub Actions a ogni push e pull request: test Python, schema
# del database, pacchetto standard, app Flutter e costruzione delle immagini Docker (senza
# pubblicarle: il registry interno non è raggiungibile da GitHub, le immagini si pubblicano
# con deploy/immagini.sh). Il pacchetto standard (atti-pa-modelli-<versione>.zip) resta
# scaricabile tra gli artefatti dell'esecuzione.
name: CI

on:
  push:
    branches: [v1, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend Python
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: atti_pa
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # come le immagini Docker
          cache: pip
          cache-dependency-path: "**/requirements.txt"
      - name: Installazione
        run: |
          for c in api converter normattiva-sync verifica-worker; do
            pip install -r $c/requirements.txt || exit 1
          done
          pip install aiosqlite==0.22.1  # database dei test
      - name: Sintassi di tutti i componenti
        run: python -m compileall -q common api/src converter/src normattiva-sync/src verifica-worker/src deploy
      - name: Schema del database su MySQL 8
        run: |
          for f in deploy/k8s/sql/0*.sql; do
            echo "$f"; mysql -h 127.0.0.1 -uroot -proot atti_pa < "$f" || exit 1
          done
      - name: Test della libreria comune
        run: python -m unittest discover -s common/tests -t .
      - name: Test dell'API
        working-directory: api/tests
        run: python test_editor_api.py
      - name: Pacchetto standard
        run: |
          python deploy/pacchetto.py prova
          python deploy/pacchetto.py crea
      - uses: actions/upload-artifact@v4
        with:
          name: pacchetto-standard
          path: atti-pa-modelli-*.zip

  frontend:
    name: Frontend Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/src
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

  immagini:
    name: Immagine ${{ matrix.componente }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        componente: [api, converter, normattiva-sync, verifica-worker, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.componente }}/Dockerfile
          push: false
          tags: atti-pa/${{ matrix.componente }}:ci
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}
