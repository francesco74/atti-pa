[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atti-common"
version = "0.1.0"
description = "Libreria condivisa atti-pa: configurazione, database, client Normattiva"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    # PyMySQL 1.2 rompe l'escape dei dati binari di aiomysql 0.3 (upload dei file)
    "pymysql>=1.1,<1.2",
    "tzdata",
    "lxml>=5",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
