# Sinonimi della ricerca nella mappatura e nei procedimenti (common/ricerca.py): ogni riga è un
# gruppo di parole equivalenti. Si confrontano per radice (contributo = contributi), quindi
# basta una forma. Cercare una parola trova anche i record con le altre del gruppo, con un peso
# un po' minore. Servono per le parole che il cittadino usa e gli atti no.
# Una sola parola per voce, e solo parole specifiche: una parola generica (servizio, pubblico,
# atto...) collegherebbe gruppi che non c'entrano.
- [affitto, locazione, canone, pigione]
- [contributo, sussidio, sovvenzione, agevolazione, bonus, beneficio, sostegno]
- [casa, abitazione, alloggio, appartamento]
