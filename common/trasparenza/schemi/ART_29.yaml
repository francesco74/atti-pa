      - {id: debiti, gruppo: Indice di liquidità a breve, etichetta: Debiti previsti, tipo: importo}
      - {id: saldo_liquidita, gruppo: Indice di liquidità a breve, etichetta: Avanzo/disavanzo/pareggio (indice di liquidità a breve) previsto, tipo: importo}
