      non previsti non vanno indicati (dicitura "n/a").
    campi:
      - *anno
      - {id: url_bilancio, etichetta: Preventivo completo di allegati, descrizione: Link alla sezione o al documento, tipo: url, obbligatorio: true}
      - {id: entrate_correnti, gruppo: Risultato finanziario, etichetta: Entrate correnti previste, tipo: importo}
      - {id: uscite_correnti, gruppo: Risultato finanziario, etichetta: Uscite correnti previste, tipo: importo}
      - {id: saldo_corrente, gruppo: Risultato finanziario, etichetta: Avanzo/disavanzo/pareggio di parte corrente previsto, tipo: importo}
