note_audit: |
  TEMPESTIVITÀ (regola specifica):
  - I documenti e gli allegati del bilancio vanno pubblicati entro 30 giorni dall'adozione: "Positivo" fino a 30
    giorni tra _ADOPTION_DATE_ e _PUB_DATE_, "Negativo" oltre.
  PREVENTIVO E CONSUNTIVO:
  - Distingui sempre preventivo e consuntivo: i campi non sono identici. Il consuntivo ha uno schema UNICO per P.A. e
    società, qualunque sia il regime contabile, con in più risultato patrimoniale e quota di contribuzione pubblica.
  - La percentuale di contribuzione pubblica va espressa come percentuale, non come importo.
  VALORI DI SINTESI:
  - Si indicano solo i valori presenti negli schemi di bilancio previsti dal regolamento dell'ente: un valore assente è
    ammesso solo se lo schema dell'ente non lo prevede (es. enti in contabilità finanziaria senza conto economico, che
    riportano la dicitura "n/a"). Altrimenti l'assenza è "Negativo".
  - Per ordini e collegi basta la sintesi testuale o il link alla Relazione del Tesoriere: non esigere voci decimali né
    il Piano degli indicatori. Neanche gli enti in contabilità semplificata hanno l'obbligo del Piano degli indicatori.
  FORMATO:
  - Dati in formato aperto e riutilizzabile, esposti in forma sintetica, aggregata e semplificata, anche con
    rappresentazioni grafiche.
