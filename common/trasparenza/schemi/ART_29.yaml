# Schema di pubblicazione art. 29 d.lgs. 33/2013 (bilancio preventivo e consuntivo).
# Fonte: Allegato 9 alla delibera ANAC n. 495/2024 (versione aggiornata al 10.06.2026).

id: ART_29
articolo: art. 29
titolo: Bilancio preventivo e consuntivo
fonte:
  delibera: "495/2024"
  allegato: 9
  versione: "10.06.2026"

ambito: non_applicabile
ambito_soggettivo: |
  Soggetti che NON trasmettono i propri dati di bilancio alla Banca Dati delle Amministrazioni Pubbliche (BDAP) e che
  quindi non possono adempiere pubblicando il solo collegamento (art. 8, co. 3, d.l. 19/2026, conv. L. 50/2026).
  Lo schema si differenzia per regime contabile: P.A. in contabilità finanziaria; P.A. e società in contabilità
  economico-patrimoniale; ordini e collegi professionali (delibera ANAC 777/2021); enti privati in contabilità
  semplificata.

documento:
  titolo: Bilancio Preventivo e Consuntivo (Art. 29 d.lgs. 33/2013)
  sottotitolo: Dati concernenti il bilancio preventivo e il conto consuntivo in forma sintetica
  introduzione: >-
    In ottemperanza agli obblighi di trasparenza concernenti il bilancio (art. 29 d.lgs. n. 33/2013), si riportano di
    seguito i dati, i riferimenti e i documenti contabili, con i valori espressi in euro, relativi a:

adempimento_alternativo:
  etichetta: L'ente trasmette i propri dati di bilancio alla BDAP
  descrizione: >-
    Art. 8, co. 3, d.l. 19/2026 (conv. L. 50/2026): l'obbligo è assolto pubblicando il collegamento alla banca dati
    BDAP (o alle altre banche dati nazionali dell'Allegato B al d.lgs. 33/2013).
  etichetta_link: Collegamento alla banca dati BDAP
  testo_documento: >-
    L'ente trasmette i propri dati di bilancio alla Banca Dati delle Amministrazioni Pubbliche (BDAP) e assolve
    l'obbligo di cui all'art. 29 d.lgs. 33/2013 mediante il collegamento ipertestuale alla banca dati (art. 8, co. 3,
    d.l. 19/2026, convertito dalla L. 50/2026).
  nota_audit: |
    VERIFICA PRELIMINARE - ESONERO EX ART. 8, CO. 3, D.L. 19/2026 (CONV. L. 50/2026):
    - Se dal documento o da _AUTHORITY_FEATURES_ risulta che l'ente trasmette i dati di bilancio alla BDAP (o alle
      altre banche dati nazionali dell'Allegato B), l'obbligo è assolto con il solo collegamento ipertestuale: verifica
      SOLO la presenza di un link valido e NON applicare la checklist di dettaglio.

parametri:
  - id: regime
    etichetta: Regime contabile dell'ente
    opzioni:
      - {valore: FINANZIARIA, etichetta: P.A. in contabilità finanziaria}
      - {valore: ECONOMICA, etichetta: P.A. o società in contabilità economico-patrimoniale}
      - valore: ORDINI
        etichetta: Ordine o collegio professionale
        nota: Basta la sintesi dei dati sulle entrate e sulle spese oppure il link alla Relazione del Tesoriere.
      - {valore: SEMPLIFICATA, etichetta: Ente privato in contabilità semplificata}
  - id: tipo_bilancio
    etichetta: Tipo di documento
    opzioni:
      - {valore: PREVENTIVO, etichetta: Bilancio preventivo / budget}
      - {valore: CONSUNTIVO, etichetta: Conto consuntivo}

_campi:
  - &anno {id: anno, etichetta: Anno, tipo: anno, obbligatorio: true}
  - &piano_indicatori {id: url_indicatori, gruppo: Piano degli indicatori, etichetta: Link al Piano degli indicatori e risultati attesi di bilancio, tipo: url, obbligatorio: true}

