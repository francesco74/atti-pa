apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: atti-pa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: atti-pa
    spec:
      # credenziali del registry interno (Secret atti-pa-registry, vedi secret.example.yaml)
      imagePullSecrets:
        - name: atti-pa-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001  # scrittura nell'archivio dei file
        seccompProfile:
          type: RuntimeDefault
      # Lo schema del database lo crea MySQL al primo avvio (mysql.yaml, deploy/k8s/sql)
      containers:
        - name: api
          image: atti-pa/api:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: atti-pa-config
            - secretRef:
                name: atti-pa-secret
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: ldap-ca, mountPath: /etc/atti-pa/ldap, readOnly: true }
            - { name: archivio, mountPath: /var/lib/atti-pa/archivio }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: archivio
          persistentVolumeClaim:
            claimName: archivio-atti
        - name: ldap-ca
          configMap:
            name: ldap-ca
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: atti-pa
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
