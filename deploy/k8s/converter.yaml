apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter
  labels:
    app.kubernetes.io/name: converter
    app.kubernetes.io/part-of: atti-pa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: converter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: converter
        app.kubernetes.io/part-of: atti-pa
    spec:
      # credenziali del registry interno (Secret atti-pa-registry, vedi secret.example.yaml)
      imagePullSecrets:
        - name: atti-pa-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: converter
          image: atti-pa/converter:0.1.0
          ports:
            - name: http
              containerPort: 8000
          env:
            - { name: CONVERSIONI_PARALLELE, value: "2" }
            - { name: CONVERSIONE_TIMEOUT, value: "120" }
            - { name: UPLOAD_MAX_MB, value: "20" }
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: LOG_LEVEL } }
            # OCR delle pagine scansionate (pa-common), dalla ConfigMap; chiave nel Secret
            - name: OCR_PROVIDER
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: OCR_PROVIDER } }
            - name: OCR_MODEL
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: OCR_MODEL } }
            - name: OCR_BASE_URL
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: OCR_BASE_URL } }
            - name: OCR_RICHIESTE_AL_MINUTO
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: OCR_RICHIESTE_AL_MINUTO } }
            - name: OCR_API_KEY
              valueFrom: { secretKeyRef: { name: atti-pa-secret, key: OCR_API_KEY, optional: true } }
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # LibreOffice scrive profilo e file temporanei in /tmp (HOME=/tmp)
            - { name: tmp, mountPath: /tmp }
        # Conversione in Markdown degli atti caricati (coda "conversione"): stessa immagine
        - name: consumatore
          image: atti-pa/converter:0.1.0
          command: ["python", "consumatore.py"]
          env:
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: atti-pa-secret, key: RABBITMQ_URL } }
            - name: RABBITMQ_PREFISSO
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: RABBITMQ_PREFISSO } }
            - name: ARCHIVIO_DIR
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: ARCHIVIO_DIR } }
            - { name: CONVERSIONE_TIMEOUT, value: "120" }
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: LOG_LEVEL } }
            # OCR delle pagine scansionate (pa-common), dalla ConfigMap; chiave nel Secret
            - name: OCR_PROVIDER
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: OCR_PROVIDER } }
            - name: OCR_MODEL
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: OCR_MODEL } }
            - name: OCR_BASE_URL
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: OCR_BASE_URL } }
            - name: OCR_RICHIESTE_AL_MINUTO
              valueFrom: { configMapKeyRef: { name: atti-pa-config, key: OCR_RICHIESTE_AL_MINUTO } }
            - name: OCR_API_KEY
              valueFrom: { secretKeyRef: { name: atti-pa-secret, key: OCR_API_KEY, optional: true } }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: archivio, mountPath: /var/lib/atti-pa/archivio, readOnly: true }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: archivio
          persistentVolumeClaim:
            claimName: archivio-atti
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: converter
  labels:
    app.kubernetes.io/name: converter
    app.kubernetes.io/part-of: atti-pa
spec:
  selector:
    app.kubernetes.io/name: converter
  ports:
    - name: http
      port: 8000
      targetPort: http
