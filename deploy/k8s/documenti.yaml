apiVersion: apps/v1
kind: Deployment
metadata:
  name: documenti
  labels:
    app.kubernetes.io/name: documenti
    app.kubernetes.io/part-of: atti-pa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: documenti
  template:
    metadata:
      labels:
        app.kubernetes.io/name: documenti
        app.kubernetes.io/part-of: atti-pa
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: documenti
          image: atti-pa/documenti:0.1.0
          ports:
            - name: http
              containerPort: 8000
          env:
            - { name: CONVERSIONI_PARALLELE, value: "2" }
            - { name: CONVERSIONE_TIMEOUT, value: "120" }
            - { name: UPLOAD_MAX_MB, value: "20" }
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # LibreOffice scrive profilo e file temporanei in /tmp (HOME=/tmp)
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: documenti
  labels:
    app.kubernetes.io/name: documenti
    app.kubernetes.io/part-of: atti-pa
spec:
  selector:
    app.kubernetes.io/name: documenti
  ports:
    - name: http
      port: 8000
      targetPort: http
