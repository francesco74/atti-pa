# Frontend e API sullo stesso dominio: il cookie di sessione funziona senza CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atti-pa
  labels:
    app.kubernetes.io/part-of: atti-pa
  annotations:
    # ingress-nginx: dimensione massima dei file caricati e tempi per le conversioni
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [atti.ente.local]
      secretName: atti-pa-tls
  rules:
    - host: atti.ente.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { name: http }
