# Regole per il controller Ingress già presente nel cluster e condiviso con altri siti:
# le annotazioni valgono solo per questo Ingress (host attipa.provincia.lucca.it), non per
# gli altri. Il TLS termina qui; atti-pa non passa dal gateway nginx del namespace rag.
# Frontend e API sullo stesso dominio: il cookie di sessione funziona senza CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atti-pa
  labels:
    app.kubernetes.io/part-of: atti-pa
  annotations:
    # ingress-nginx. Gli altri timeout sono calibrati su questi valori: LLM_TIMEOUT_REDAZIONE
    # (60 s) e DOCUMENTI_TIMEOUT (150 s) restano sotto i 180 s, UPLOAD_MAX_MB (20) sotto 25 MB.
    # Con un controller diverso vanno impostati gli equivalenti.
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    # http → https: il cookie di sessione è Secure (COOKIE_SECURE), in http il login non va
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # classe del controller esistente (kubectl get ingressclass)
  ingressClassName: ingress-nginx-internet
  tls:
    - hosts: [attipa.provincia.lucca.it]
      secretName: attipa-tls-secret
  rules:
    - host: attipa.provincia.lucca.it
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { name: http }
