# Database MySQL 8 di atti-pa, nel namespace. Password nel Secret mysql-secret (vedi
# secret.example.yaml). Al primo avvio, con il volume vuoto, MySQL crea il database e
# l'utente atti_pa ed esegue lo schema (ConfigMap mysql-schema, generata da sql/ in
# kustomization.yaml); agli avvii successivi non riesegue nulla. Le migrazioni successive
# (sql/0002_...sql) si applicano a mano, vedi il README.
# Va incluso nei backup insieme all'archivio dei file.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: atti-pa
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: atti-pa
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # utente mysql dell'immagine ufficiale
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            # sottocartella: la radice del volume ext4 contiene lost+found, che blocca
            # l'inizializzazione di MySQL
            - --datadir=/var/lib/mysql/dati
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: root-password } }
            - name: MYSQL_DATABASE
              value: atti_pa
            - name: MYSQL_USER
              value: atti_pa
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: password } }
          readinessProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"']
            # il primo avvio inizializza il database ed esegue lo schema
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: dati, mountPath: /var/lib/mysql }
            - { name: schema, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /var/run/mysqld }
      volumes:
        - name: schema
          configMap: { name: mysql-schema }
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: dati
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: atti-pa
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
