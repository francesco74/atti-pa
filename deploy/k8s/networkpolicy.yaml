# Ingresso consentito solo dove serve. L'uscita resta libera perché i servizi devono
# raggiungere MySQL, Active Directory, Normattiva e il server LLM: restringerla
# secondo gli indirizzi effettivi dell'ente.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nega-ingresso
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingresso-web
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api, frontend]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# Il servizio documenti è raggiungibile solo dall'API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: documenti-solo-da-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: documenti
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 8000
