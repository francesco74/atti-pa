# Esempio: NON versionare i valori reali. Creare il Secret con
#   kubectl -n atti-pa create secret generic atti-pa-secret --from-env-file=secret.env
# e il certificato della CA di Active Directory con
#   kubectl -n atti-pa create configmap ldap-ca --from-file=ca.pem
apiVersion: v1
kind: Secret
metadata:
  name: atti-pa-secret
  labels:
    app.kubernetes.io/part-of: atti-pa
type: Opaque
stringData:
  DATABASE_URL: "mysql+aiomysql://atti_pa:CAMBIAMI@mysql.database.svc.cluster.local:3306/atti_pa"
  # almeno 32 caratteri casuali (altrimenti l'API non parte), es. `openssl rand -base64 48`
  JWT_SECRET: "CAMBIAMI"
  # chiave del provider LLM: obbligatoria per openai e gemini, per anthropic la chiave
  # dell'API di Anthropic; vuota per i modelli on-premise
  LLM_API_KEY: ""
  # RabbitMQ: stesse credenziali di rabbitmq-secret
  RABBITMQ_URL: "amqp://atti_pa:CAMBIAMI@rabbitmq:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  labels:
    app.kubernetes.io/part-of: atti-pa
type: Opaque
stringData:
  utente: "atti_pa"
  password: "CAMBIAMI"
  # cookie Erlang: stringa casuale, es. `openssl rand -hex 32`
  cookie: "CAMBIAMI"

