# Esempio: NON versionare i valori reali. Creare il Secret con
#   kubectl -n atti-pa create secret generic atti-pa-secret --from-env-file=secret.env
# e il certificato della CA di Active Directory con
#   kubectl -n atti-pa create configmap ldap-ca --from-file=ca.pem
# Il Secret atti-pa-registry (in fondo) si può anche creare con
#   kubectl -n atti-pa create secret docker-registry atti-pa-registry \
#     --docker-server=registry.intranet.provincia.lucca --docker-username=UTENTE --docker-password=PASSWORD
apiVersion: v1
kind: Secret
metadata:
  name: atti-pa-secret
  labels:
    app.kubernetes.io/part-of: atti-pa
type: Opaque
stringData:
  # MySQL del namespace (mysql.yaml): stessa password di mysql-secret
  DATABASE_URL: "mysql+aiomysql://atti_pa:CAMBIAMI@mysql:3306/atti_pa"
  # almeno 32 caratteri casuali (altrimenti l'API non parte), es. `openssl rand -base64 48`
  JWT_SECRET: "CAMBIAMI"
  # chiave del provider LLM: obbligatoria per openai e gemini, per anthropic la chiave
  # dell'API di Anthropic; vuota per i modelli on-premise
  LLM_API_KEY: ""
  # RabbitMQ: stesse credenziali di rabbitmq-secret
  RABBITMQ_URL: "amqp://atti_pa:CAMBIAMI@rabbitmq:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  labels:
    app.kubernetes.io/part-of: atti-pa
type: Opaque
stringData:
  # password casuali, es. `openssl rand -base64 24`; usate solo al primo avvio di MySQL
  # (volume vuoto): cambiarle dopo richiede ALTER USER nel database
  root-password: "CAMBIAMI"
  password: "CAMBIAMI"     # utente atti_pa, la stessa di DATABASE_URL
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  labels:
    app.kubernetes.io/part-of: atti-pa
type: Opaque
stringData:
  utente: "atti_pa"
  password: "CAMBIAMI"
  # cookie Erlang: stringa casuale, es. `openssl rand -hex 32`
  cookie: "CAMBIAMI"
---
# Credenziali per scaricare le immagini dal registry interno (imagePullSecrets dei pod).
# .dockerconfigjson: il JSON qui sotto, con "auth" = base64 di "utente:password", es.
#   echo -n 'UTENTE:PASSWORD' | base64
apiVersion: v1
kind: Secret
metadata:
  name: atti-pa-registry
  labels:
    app.kubernetes.io/part-of: atti-pa
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths": {"registry.intranet.provincia.lucca": {"auth": "CAMBIAMI"}}}
