apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: atti-pa
spec:
  # Più repliche elaborano la coda in parallelo (SELECT ... FOR UPDATE SKIP LOCKED).
  # Dimensionare in base alla capacità del server LLM.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: atti-pa
    spec:
      # tempo per completare la verifica in corso dopo SIGTERM
      terminationGracePeriodSeconds: 600
      # credenziali del registry interno (Secret atti-pa-registry, vedi secret.example.yaml)
      imagePullSecrets:
        - name: atti-pa-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001  # lettura ed eliminazione dei file caricati per la trasparenza
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: atti-pa/worker:0.1.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: atti-pa-config
            - secretRef:
                name: atti-pa-secret
          livenessProbe:
            # il worker aggiorna /tmp/heartbeat a ogni ciclo
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 900
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            # Chromium (Playwright) per le pagine della trasparenza caricate via JavaScript
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: archivio, mountPath: /var/lib/atti-pa/archivio }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: archivio
          persistentVolumeClaim:
            claimName: archivio-atti
