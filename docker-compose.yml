# Ambiente locale di prova (uso personale, senza Active Directory).
#   docker compose up --build
# Applicazione: http://localhost:8080   API (Flask): http://localhost:8000/api/v1/health
#
# L'LLM non è incluso. Ollama sul computer: nel .env LLM_PROVIDER=ollama e
# LLM_BASE_URL=http://host.docker.internal:11434/v1.
# Altri provider: LLM_PROVIDER=openai|gemini|anthropic LLM_API_KEY=... docker compose up
#
# Container con nomi fissi (atti-pa-api, atti-pa-worker, atti-pa-mysql...), es.
#   docker logs -f atti-pa-worker
#
# Log: LOG_LEVEL=DEBUG docker compose up   (DEBUG, INFO, WARNING, ERROR; vale anche per
# la console del browser). Con LOG_SQL=true e LOG_LEVEL=DEBUG anche le query SQL.

x-comune: &comune
  environment: &ambiente
    DATABASE_URL: mysql+aiomysql://atti_pa:password@mysql:3306/atti_pa
    # password iniziale dell'admin degli enti creati con enti.py (da cambiare al primo accesso)
    PASSWORD_INIZIALE: ${PASSWORD_INIZIALE:-Cambiami-subito-1}
    COOKIE_SECURE: "false"
    JWT_SECRET: sviluppo-locale-non-usare-in-produzione
    # cifra nel database le chiavi dei servizi collegati (es. il RAG di ogni ente)
    CHIAVE_CIFRATURA: ${CHIAVE_CIFRATURA:-sviluppo-locale-non-usare-in-produzione}
    DOCUMENTI_URL: http://converter:8000
    RABBITMQ_URL: amqp://atti_pa:password@rabbitmq:5672/
    ARCHIVIO_DIR: /var/lib/atti-pa/archivio
    LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    # Ollama gira sul computer che ospita i container; gli altri provider usano il proprio
    # vuoto = predefinito del provider; per Ollama sul computer host:
    # LLM_BASE_URL=http://host.docker.internal:11434/v1
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_EFFORT: ${LLM_EFFORT:-medium}
    # modello di embedding per la ricerca (vuoto = solo per parole), es. vLLM sul computer:
    # EMBEDDING_BASE_URL=http://host.docker.internal:8002/v1 EMBEDDING_MODEL=BAAI/bge-m3
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_SQL: ${LOG_SQL:-false}
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  mysql:
    container_name: atti-pa-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: atti_pa
      MYSQL_USER: atti_pa
      MYSQL_PASSWORD: password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql:/var/lib/mysql
      # Schema del database: l'immagine MySQL esegue questi file solo alla prima
      # inizializzazione (volume vuoto). Per ricrearlo: docker compose down -v
      - ./deploy/k8s/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 30

  # Consultazione del database: http://localhost:8081 (accesso già fatto come root)
  phpmyadmin:
    container_name: atti-pa-phpmyadmin
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports: ["8081:80"]
    depends_on:
      mysql: { condition: service_healthy }

  # Code tra API, converter e worker. Interfaccia di gestione: http://localhost:15673
  # (atti_pa / password); AMQP sulla 5673 per i componenti avviati fuori da compose
  rabbitmq:
    container_name: atti-pa-rabbitmq
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: atti_pa
      RABBITMQ_DEFAULT_PASS: password
      # Cookie Erlang esplicito: con fs.protected_regular=2 (kernel recenti) RabbitMQ non
      # riesce a creare da solo il cookie nella sua cartella e non parte
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie atti-pa-sviluppo
      RABBITMQ_CTL_ERL_ARGS: -setcookie atti-pa-sviluppo
    ports: ["5673:5672", "15673:15672"]
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 30

  api:
    container_name: atti-pa-api
    <<: *comune
    build: { context: ., dockerfile: api/Dockerfile }
    ports: ["8000:8000"]
    volumes:
      - archivio:/var/lib/atti-pa/archivio
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    container_name: atti-pa-worker
    <<: *comune
    build: { context: ., dockerfile: worker/Dockerfile }
    volumes:
      - archivio:/var/lib/atti-pa/archivio  # file caricati per le analisi della trasparenza
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Servizio HTTP di conversione (documenti delle bozze in PDF/PDF-A)
  converter:
    container_name: atti-pa-converter
    build: { context: ., dockerfile: converter/Dockerfile }
    environment: &ocr
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # OCR delle pagine scansionate (pa-common): senza chiave i PDF scansionati sono rifiutati
      OCR_PROVIDER: ${OCR_PROVIDER:-gemini}
      OCR_MODEL: ${OCR_MODEL:-gemini-3-flash-preview}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_BASE_URL: ${OCR_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Conversione in Markdown degli atti caricati (coda "conversione"): stessa immagine
  converter-consumatore:
    container_name: atti-pa-converter-consumatore
    build: { context: ., dockerfile: converter/Dockerfile }
    command: ["python", "consumatore.py"]
    environment:
      <<: *ocr
      RABBITMQ_URL: amqp://atti_pa:password@rabbitmq:5672/
      ARCHIVIO_DIR: /var/lib/atti-pa/archivio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - archivio:/var/lib/atti-pa/archivio:ro
    depends_on:
      rabbitmq: { condition: service_healthy }

  frontend:
    container_name: atti-pa-frontend
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["8080:8080"]
    environment:
      API_URL: ""  # vuoto: stessa origine, /api passa dal proxy di nginx
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./frontend/nginx-locale.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

  # Esecuzione manuale: docker compose run --rm normattiva-sync
  normattiva-sync:
    <<: *comune
    build: { context: ., dockerfile: normattiva-sync/Dockerfile }
    profiles: [job]
    depends_on:
      mysql: { condition: service_healthy }

volumes:
  mysql:
  rabbitmq:
  archivio:  # file originali degli atti e caricati per la trasparenza (API, converter, worker)
