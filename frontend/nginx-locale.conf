server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Intestazioni di sicurezza
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Tutto in no-cache: il browser tiene i file ma li riconvalida a ogni apertura (304 se
    # invariati). Flutter non mette l'impronta nei nomi (main.dart.js...), con una cache lunga
    # dopo un rilascio resterebbe la versione vecchia.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    # Configurazione dell'app generata all'avvio dalle variabili d'ambiente (config-app.sh)
    location = /config.json {
        alias /tmp/atti-pa/config.json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(js|wasm|css|png|svg|ttf|otf|woff2?|json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Solo in locale (docker compose): in Kubernetes /api è instradato dall'Ingress
    location /api/ {
        # L'anteprima PDF degli atti si mostra nell'app in un iframe: niente DENY ereditato
        # dal server (in produzione /api non passa da qui). Un add_header qui sostituisce
        # tutti quelli del blocco server, quindi si ripetono.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'" always;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 180s;
    }

    # Editor dei documenti della trasparenza (web/editor), mostrato dall'app in un iframe:
    # policy propria, che consente l'iframe della stessa origine e solo script in file.
    location ^~ /editor/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    }

    # Applicazione a pagina singola
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
