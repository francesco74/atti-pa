server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Intestazioni di sicurezza
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # index.html e bootstrap sempre aggiornati, il resto in cache a lungo
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    location ~* (flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(js|wasm|css|png|svg|ttf|otf|woff2?|json)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Solo in locale (docker compose): in Kubernetes /api è instradato dall'Ingress
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 180s;
    }

    # Applicazione a pagina singola
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
