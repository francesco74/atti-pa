name: atti_pa
description: Redazione e controllo delle determinazioni dirigenziali.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0  # Flutter 3.38 o successivo (richiesto da file_picker 13)

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  provider: ^6.1.5
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  # riquadro HTML (iframe) per mostrare il PDF dell'atto originale
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Font inclusi: la rete dell'ente può non raggiungere i CDN di Google
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
