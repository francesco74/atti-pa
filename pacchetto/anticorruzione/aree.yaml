# Aree di rischio degli enti locali: generali (PNA 2019, All. 1, Tab. 3) e specifiche di
# comuni e province (governo del territorio, pianificazione urbanistica, rifiuti). Create negli
# enti che non le hanno, mai cancellate.
aree:
- codice: A
  descrizione: Acquisizione e gestione del personale
  descrizione_breve: 'Personale: reclutamento, progressioni, gestione'
- codice: B
  descrizione: Contratti pubblici (affidamento ed esecuzione di lavori, servizi e forniture)
  descrizione_breve: 'Contratti pubblici: programmazione, affidamento, esecuzione'
- codice: C
  descrizione: Provvedimenti ampliativi della sfera giuridica dei destinatari privi di effetto economico diretto
    ed immediato per il destinatario
  descrizione_breve: Autorizzazioni, concessioni, servizi demografici
- codice: D
  descrizione: Provvedimenti ampliativi della sfera giuridica dei destinatari con effetto economico diretto ed immediato
    per il destinatario
  descrizione_breve: Contributi, sussidi, agevolazioni
- codice: E
  descrizione: Gestione delle entrate, delle spese e del patrimonio
  descrizione_breve: Tributi, bilancio, patrimonio, partecipate
- codice: F
  descrizione: Controlli, verifiche, ispezioni e sanzioni
  descrizione_breve: Vigilanza, polizia locale, sanzioni
- codice: G
  descrizione: Incarichi e nomine
  descrizione_breve: Incarichi esterni, nomine e designazioni
- codice: H
  descrizione: Affari legali e contenzioso
  descrizione_breve: Contenzioso, incarichi legali, transazioni
- codice: I
  descrizione: Governo del territorio
  descrizione_breve: Edilizia, paesaggio, vincoli
- codice: L
  descrizione: Pianificazione urbanistica
  descrizione_breve: Piani urbanistici, varianti, convenzioni
- codice: M
  descrizione: Gestione dei rifiuti
  descrizione_breve: Igiene urbana e rifiuti
