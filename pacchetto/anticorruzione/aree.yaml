# Aree di rischio (PNA 2019 e PIAO del Comune di Lucca, § 2.3): create negli enti che non
# le hanno, mai cancellate.
aree:
- codice: A
  descrizione: Provvedimenti ampliativi della sfera giuridica dei destinatari privi di effetto economico
    diretto ed immediato per il destinatario
  descrizione_breve: Autorizzazioni, concessioni, abilitazioni
- codice: B
  descrizione: Provvedimenti ampliativi della sfera giuridica dei destinatari con effetto economico diretto
    ed immediato per il destinatario
  descrizione_breve: Contributi, sussidi, agevolazioni
- codice: C
  descrizione: Contratti pubblici (ex affidamento di lavori, servizi e forniture)
  descrizione_breve: Affidamenti di lavori, servizi e forniture
- codice: D
  descrizione: Acquisizione e gestione del personale (ex acquisizione, progressione e gestione del personale)
  descrizione_breve: Concorsi, assunzioni, progressioni
- codice: E
  descrizione: Gestione delle entrate, delle spese e del patrimonio
  descrizione_breve: Tributi, bilancio, patrimonio
- codice: F
  descrizione: Controlli, verifiche, ispezioni e sanzioni
  descrizione_breve: Attività ispettive e sanzionatorie
- codice: G
  descrizione: Incarichi e nomine
  descrizione_breve: Incarichi professionali e nomine
- codice: H
  descrizione: Affari legali e contenzioso
  descrizione_breve: Contenzioso
- codice: I
  descrizione: Governo del territorio
  descrizione_breve: Edilizia e territorio
- codice: L
  descrizione: Gestione dei rifiuti
  descrizione_breve: Igiene urbana
- codice: M
  descrizione: Pianificazione urbanistica
  descrizione_breve: Piani urbanistici e varianti
- codice: N
  descrizione: Programmazione e controlli
  descrizione_breve: Programmazione e controlli interni
- codice: O
  descrizione: Supporto agli organi
  descrizione_breve: Organi istituzionali
- codice: EXL
  descrizione: Servizi demografici (ex area L)
  descrizione_breve: Anagrafe, stato civile, elettorale
