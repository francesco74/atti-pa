# questo pacchetto, con i testi uguali riuniti in una voce sola. Le voci si creano negli enti
# se mancano e non si cancellano mai; i codici non vanno cambiati né riusati: una voce nuova
# prende il numero successivo. I codici delle voci create dagli enti hanno la E (ATT-E001).
