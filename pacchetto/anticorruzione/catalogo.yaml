rischi:
- codice: RIS-0001
  descrizione: Programmazione dei profili e dei requisiti orientata a favorire candidati determinati
- codice: RIS-0002
  descrizione: Mancata pubblicazione della programmazione e dei posti da coprire
- codice: RIS-0003
  descrizione: Previsione di requisiti di accesso «personalizzati» e insufficienza di meccanismi oggettivi e trasparenti
    per verificarne il possesso, allo scopo di reclutare candidati particolari
- codice: RIS-0004
  descrizione: Irregolare composizione della commissione finalizzata al reclutamento di candidati particolari
- codice: RIS-0005
  descrizione: Inosservanza delle regole a garanzia dell'imparzialità della selezione, come l'anonimato della prova
    scritta e la predeterminazione dei criteri di valutazione
- codice: RIS-0006
  descrizione: Fuga di notizie sulle tracce delle prove
- codice: RIS-0007
  descrizione: Omessa verifica dei titoli e dei requisiti dichiarati
- codice: RIS-0008
  descrizione: Scelta discrezionale della graduatoria di altro ente per favorire un candidato determinato
- codice: RIS-0009
  descrizione: Mancato rispetto dell'ordine della graduatoria
- codice: RIS-0010
  descrizione: Valutazione discrezionale dei candidati senza criteri predeterminati
- codice: RIS-0011
  descrizione: Progressioni accordate illegittimamente allo scopo di agevolare dipendenti particolari
- codice: RIS-0012
  descrizione: Conferimento non motivato o su criteri non trasparenti, per favorire dipendenti particolari
- codice: RIS-0013
  descrizione: Conferimento in presenza di cause di inconferibilità o di conflitto di interessi
- codice: RIS-0014
  descrizione: Motivazione generica sulla sussistenza dei presupposti e scelta fiduciaria del candidato
- codice: RIS-0015
  descrizione: Conferimento in presenza di cause di inconferibilità o incompatibilità (d.lgs. 39/2013)
- codice: RIS-0016
  descrizione: Assunzione fiduciaria in assenza dei requisiti o per finalità diverse dal supporto agli organi
- codice: RIS-0017
  descrizione: Individuazione del lavoratore o del tirocinante al di fuori delle procedure previste
- codice: RIS-0018
  descrizione: Autorizzazione di incarichi in conflitto con l'attività d'ufficio o svolgimento di incarichi non
    autorizzati
- codice: RIS-0019
  descrizione: Falsa attestazione della presenza in servizio o fruizione indebita di permessi
- codice: RIS-0020
  descrizione: Autorizzazione di straordinari non necessari o non svolti
- codice: RIS-0021
  descrizione: Costituzione del fondo oltre i limiti di legge o destinazione delle risorse non conforme al contratto
    nazionale
- codice: RIS-0022
  descrizione: Valutazione non coerente con il sistema di misurazione e valutazione, con premi distribuiti in modo
    indifferenziato o di favore
- codice: RIS-0023
  descrizione: Omessa o ritardata attivazione del procedimento disciplinare per favorire il dipendente
- codice: RIS-0024
  descrizione: Sanzione non proporzionata o archiviazione non motivata
- codice: RIS-0025
  descrizione: Scelta dei partecipanti e dei soggetti formatori non coerente con i fabbisogni rilevati
- codice: RIS-0026
  descrizione: Programmazione non aderente ai fabbisogni effettivi, orientata a interessi particolari, o ricorso
    sistematico agli acquisti non programmati e alle proroghe
- codice: RIS-0027
