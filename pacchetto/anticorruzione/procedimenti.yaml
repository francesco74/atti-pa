- codice: PRC-0006
  ambito: COMUNE
  denominazione: Autorizzazione all'installazione di mezzi e impianti pubblicitari
  descrizione: Autorizzazione a installare insegne, cartelli, preinsegne e altri mezzi pubblicitari visibili dalla
    strada, verificandone dimensioni, collocazione e sicurezza secondo il codice della strada e il regolamento comunale;
    l'esposizione è soggetta al canone unico.
  norma_riferimento: D.lgs. 285/1992, art. 23; d.P.R. 495/1992, artt. 47-59; regolamento comunale
  termine_conclusione: 60 giorni
