  denominazione: Cancellazione anagrafica per irreperibilità
  descrizione: Il cittadino che non ha più dimora abituale nel comune, senza aver dichiarato il trasferimento, è
    cancellato dall'anagrafe dopo ripetuti accertamenti negativi; il procedimento si avvia d'ufficio o su segnalazione
    di chiunque vi abbia interesse.
  norma_riferimento: D.P.R. 223/1989, artt. 7 e 11
  termine_conclusione: Dopo almeno un anno dal primo accertamento negativo (art. 11 d.P.R. 223/1989)
