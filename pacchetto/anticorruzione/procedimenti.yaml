- codice: PRC-0008
  ambito: COMUNE
  denominazione: Segnalazione certificata di inizio attività per attività produttive e commerciali (SCIA)
  descrizione: Segnalazione certificata per avviare, modificare, trasferire o cessare un'attività produttiva o commerciale
    (esercizi di vicinato, pubblici esercizi, acconciatori ed estetisti, artigiani). L'attività può iniziare dalla
    presentazione; il SUAP controlla i requisiti nei 60 giorni successivi e può vietarne la prosecuzione.
  norma_riferimento: L. 241/1990, art. 19; d.P.R. 160/2010, art. 5; d.lgs. 222/2016
  termine_conclusione: 60 giorni per i controlli (art. 19 l. 241/1990)
