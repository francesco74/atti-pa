# Procedimenti standard degli enti locali (art. 35 d.lgs. 33/2013): solo i dati che vengono
# dalla norma. Nell'ente prendono il codice P.n e si completano con uffici, recapiti, modulistica
# e orari; il codice PRC non va cambiato né riusato. Creati se mancano, mai cancellati.
procedimenti:
- codice: PRC-0001
  denominazione: Selezione pubblica per l'assunzione di personale
  descrizione: Selezione pubblica per titoli e/o esami per l'assunzione di personale a tempo indeterminato o determinato.
    Il bando, pubblicato sul portale InPA, indica requisiti, prove e criteri di valutazione; la commissione esaminatrice
    svolge le prove e forma la graduatoria, approvata con provvedimento del responsabile.
  norma_riferimento: D.lgs. 165/2001, art. 35; d.P.R. 487/1994; regolamento dell'ente sull'accesso agli impieghi
  termine_conclusione: 180 giorni dalla prima prova (art. 11 d.P.R. 487/1994)
  art35:
    tipologia: Personale - reclutamento
    istanza_di_parte: SI
    silenzio_assenso: 'NO'
    dichiarazione_sostitutiva: SI
    strumenti_tutela: Ricorso al TAR entro 60 giorni o ricorso straordinario al Presidente della Repubblica entro
      120 giorni; in caso di inerzia, richiesta di intervento del titolare del potere sostitutivo (art. 2, c. 9-bis,
      l. 241/1990)
- codice: PRC-0002
  denominazione: Mobilità volontaria esterna tra enti
  descrizione: Passaggio diretto di dipendenti di altre pubbliche amministrazioni nei posti vacanti dell'ente, tramite
    avviso pubblico con i profili richiesti e i criteri di scelta; segue il colloquio e, se previsto, il nulla osta
    dell'amministrazione di appartenenza.
  norma_riferimento: D.lgs. 165/2001, art. 30
  termine_conclusione: Termine fissato dall'avviso
  art35:
    tipologia: Personale - reclutamento
    istanza_di_parte: SI
    silenzio_assenso: 'NO'
    dichiarazione_sostitutiva: SI
    strumenti_tutela: Ricorso al TAR entro 60 giorni o ricorso straordinario al Presidente della Repubblica entro
      120 giorni; in caso di inerzia, richiesta di intervento del titolare del potere sostitutivo (art. 2, c. 9-bis,
      l. 241/1990)
- codice: PRC-0003
  denominazione: Autorizzazione allo svolgimento di incarichi extraistituzionali dei dipendenti
  descrizione: Il dipendente chiede l'autorizzazione a svolgere un incarico retribuito presso altri soggetti. L'ente
    verifica l'assenza di incompatibilità e di conflitto di interessi e la compatibilità con l'orario e i compiti
    d'ufficio, poi autorizza o nega; gli incarichi autorizzati si comunicano tramite PerlaPA.
  norma_riferimento: D.lgs. 165/2001, art. 53
  termine_conclusione: 30 giorni (art. 53, c. 10, d.lgs. 165/2001)
  art35:
    tipologia: Personale - gestione
    istanza_di_parte: SI
    silenzio_assenso: SI
    dichiarazione_sostitutiva: SI
    strumenti_tutela: Ricorso al giudice ordinario nei termini di legge; in caso di inerzia, intervento del titolare
      del potere sostitutivo
- codice: PRC-0004
  ambito: COMUNE
  denominazione: Concessione di occupazione temporanea o permanente di suolo pubblico
  descrizione: Concessione per occupare temporaneamente o in modo permanente spazi e aree pubbliche (dehors, ponteggi,
    banchi, cantieri, manifestazioni). L'istanza indica superficie, durata e uso; la concessione fissa le prescrizioni
    e il canone unico patrimoniale dovuto.
  norma_riferimento: L. 160/2019, art. 1, cc. 816-847 (canone unico); regolamento comunale del canone
  termine_conclusione: 30 giorni
  art35:
    tipologia: Autorizzazioni e concessioni
    istanza_di_parte: SI
    silenzio_assenso: 'NO'
    dichiarazione_sostitutiva: SI
