- codice: PRC-0060
  ambito: COMUNE
  denominazione: Iscrizione all'AIRE e trasferimento della residenza all'estero
  descrizione: I cittadini italiani che trasferiscono la residenza all'estero per più di 12 mesi lo dichiarano al
    consolato entro 90 giorni dall'espatrio (o al comune prima della partenza); il comune li cancella dall'anagrafe
    e li iscrive nell'anagrafe degli italiani residenti all'estero, che consente di votare e di ottenere i certificati.
  norma_riferimento: L. 470/1988; d.P.R. 323/1989; d.P.R. 223/1989
  termine_conclusione: Termini del d.P.R. 323/1989, dalla ricezione della comunicazione consolare
