      120 giorni; in caso di inerzia, richiesta di intervento del titolare del potere sostitutivo (art. 2, c. 9-bis,
      l. 241/1990)
- codice: PRC-0005
  ambito: COMUNE
  denominazione: Autorizzazione all'apertura di passo carrabile
  descrizione: Autorizzazione all'accesso dei veicoli da un'area privata alla strada comunale, con il rilascio del
    cartello di passo carrabile. Si verificano la sicurezza della circolazione e la conformità al codice della strada;
    il passo è soggetto al canone unico.
  norma_riferimento: D.lgs. 285/1992, art. 22; d.P.R. 495/1992, art. 46
  termine_conclusione: 30 giorni
  art35:
