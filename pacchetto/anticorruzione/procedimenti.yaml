  ambito: COMUNE
  denominazione: Iscrizione nello schedario della popolazione temporanea
  descrizione: Chi dimora nel comune da almeno quattro mesi per lavoro, studio o cura, senza potervi stabilire la
    residenza, chiede l'iscrizione nello schedario della popolazione temporanea; l'iscrizione non dà luogo a certificati
    anagrafici ma a un'attestazione.
