- codice: PRC-0007
  ambito: COMUNE
  denominazione: Autorizzazione per attività produttive e commerciali (SUAP, procedimento ordinario)
  descrizione: 'Procedimento ordinario dello sportello unico per le attività produttive, per le attività che richiedono
    un provvedimento espresso: la domanda si presenta online, il SUAP acquisisce i pareri degli enti coinvolti,
    anche in conferenza di servizi, e rilascia il titolo unico.'
  norma_riferimento: D.P.R. 160/2010, art. 7; d.lgs. 114/1998; d.lgs. 222/2016
  termine_conclusione: 30 giorni dalla ricezione (procedimento ordinario SUAP)
