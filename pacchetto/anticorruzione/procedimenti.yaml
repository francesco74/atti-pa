  descrizione: Due persone maggiorenni, unite stabilmente da legami affettivi e di reciproca assistenza, coabitanti
    e iscritte nello stesso stato di famiglia, dichiarano la convivenza di fatto, che viene registrata in anagrafe;
    con la stessa procedura se ne dichiara la cessazione.
  norma_riferimento: L. 76/2016, art. 1, cc. 36-65; d.P.R. 223/1989, art. 13
  termine_conclusione: 2 giorni lavorativi per la registrazione, 45 giorni per gli accertamenti
