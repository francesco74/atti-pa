- codice: PRC-0016
  ambito: COMUNE
  denominazione: Iscrizione anagrafica e cambio di residenza
  descrizione: Dichiarazione di residenza per chi trasferisce la dimora abituale nel comune da un altro comune o
    dall'estero, o cambia abitazione all'interno del comune. L'ufficio registra la dichiarazione entro 2 giorni
    lavorativi; la polizia locale accerta la dimora abituale e, se nei 45 giorni non è comunicato l'esito negativo,
    l'iscrizione si intende confermata.
  norma_riferimento: L. 1228/1954; d.P.R. 223/1989; d.l. 5/2012, art. 5
  termine_conclusione: 2 giorni lavorativi per la registrazione, 45 giorni per gli accertamenti (silenzio assenso)
