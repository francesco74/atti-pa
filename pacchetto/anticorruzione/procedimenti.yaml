- codice: PRC-0009
  ambito: COMUNE
  denominazione: Autorizzazione all'apertura di medie e grandi strutture di vendita
  descrizione: Autorizzazione all'apertura, al trasferimento o all'ampliamento di esercizi commerciali con superficie
    di vendita superiore a quella degli esercizi di vicinato, nel rispetto della programmazione commerciale e urbanistica;
