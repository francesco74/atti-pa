# Processi standard dell'area A per comuni e province. La valutazione
# di ogni rischio è una proposta: entra nei rischi nuovi e l'ente la rivede.
area: A
processi:
- codice: A.1
  denominazione: Programmazione dei fabbisogni di personale
  descrizione: Piano triennale dei fabbisogni nella sezione Organizzazione e capitale umano del PIAO, con le capacità
    assunzionali e le modalità di copertura dei posti
  tempi: Annuale, con il PIAO
  attori_esterni: Organi di indirizzo, revisore dei conti
  attivita:
  - codice: A.1.1
    descrizione: Ricognizione delle carenze e delle eccedenze di personale con i responsabili delle strutture
  - codice: A.1.2
    descrizione: Definizione dei profili da assumere e delle modalità di copertura
    rischi:
    - codice: A.1.2_R.1
      evento: Programmazione dei profili e dei requisiti orientata a favorire candidati determinati
      fattore_abilitante: Mancata attuazione del principio di distinzione tra politica e amministrazione
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: A.1.2_R.1_M.1
        descrizione: Motivazione puntuale del provvedimento, con richiamo dei presupposti e dei criteri applicati
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni provvedimento
        indicatore: Provvedimenti con motivazione completa ai controlli successivi
        target: 100%
      - codice: A.1.2_R.1_M.2
        descrizione: Coerenza dei profili con gli obiettivi del PIAO, verificata con il parere del revisore e la
          relazione dei responsabili delle strutture
        tipo: SPECIFICA
        categoria: Regolamentazione
        tempi: Annuale
        indicatore: Profili programmati motivati con le esigenze delle strutture
        target: 100%
  - codice: A.1.3
    descrizione: Approvazione del piano e pubblicazione
    rischi:
    - codice: A.1.3_R.1
      evento: Mancata pubblicazione della programmazione e dei posti da coprire
      fattore_abilitante: Mancanza di trasparenza
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso, '8': Basso,
          '9': Basso}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: A.1.3_R.1_M.1
        descrizione: Pubblicazione tempestiva dei dati e degli atti in Amministrazione trasparente (d.lgs. 33/2013)
        tipo: GENERALE
        categoria: Trasparenza
        tempi: Nei termini di legge
        indicatore: Atti pubblicati nei termini sul totale
        target: 100%
- codice: A.2
  denominazione: Concorso pubblico per assunzioni a tempo indeterminato
  descrizione: Reclutamento tramite selezione pubblica, dalla scelta dei requisiti del bando all'assunzione dei
    vincitori
  tempi: 180 giorni dalla prima prova
  attori_esterni: Candidati, commissari esterni
  attivita:
  - codice: A.2.1
    descrizione: Redazione e pubblicazione del bando sul portale InPA
    rischi:
    - codice: A.2.1_R.1
      evento: Previsione di requisiti di accesso «personalizzati» e insufficienza di meccanismi oggettivi e trasparenti
        per verificarne il possesso, allo scopo di reclutare candidati particolari
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: A.2.1_R.1_M.1
        descrizione: Regolamento o disciplinare dell'ente con criteri e requisiti predeterminati e pubblicati
        tipo: SPECIFICA
        categoria: Regolamentazione
        tempi: Revisione triennale
        indicatore: Regolamento adottato e aggiornato
        target: Entro l'anno
      - codice: A.2.1_R.1_M.2
        descrizione: Bando conforme allo schema tipo dell'ente, con requisiti verificati dal responsabile del personale
          e dal segretario
        tipo: SPECIFICA
        categoria: Regolamentazione
        tempi: A ogni bando
        indicatore: Bandi conformi allo schema tipo
        target: 100%
      - codice: A.2.1_R.1_M.3
        descrizione: Pubblicazione tempestiva dei dati e degli atti in Amministrazione trasparente (d.lgs. 33/2013)
        tipo: GENERALE
        categoria: Trasparenza
        tempi: Nei termini di legge
        indicatore: Atti pubblicati nei termini sul totale
        target: 100%
  - codice: A.2.2
    descrizione: Nomina della commissione esaminatrice
    rischi:
    - codice: A.2.2_R.1
      evento: Irregolare composizione della commissione finalizzata al reclutamento di candidati particolari
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte di pochi
        o di un unico soggetto
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: A.2.2_R.1_M.1
        descrizione: Verifica dell'assenza di condanne per reati contro la pubblica amministrazione per componenti
          di commissioni e uffici a rischio (art. 35-bis d.lgs. 165/2001)
        tipo: GENERALE
        categoria: Controllo
        tempi: A ogni nomina
        indicatore: Verifiche effettuate sulle nomine
        target: 100%
      - codice: A.2.2_R.1_M.2
        descrizione: Dichiarazione di assenza di conflitto di interessi da parte di chi istruisce e decide, con
          obbligo di astensione (art. 6-bis l. 241/1990, d.P.R. 62/2013)
        tipo: GENERALE
        categoria: Disciplina del conflitto di interessi
        tempi: A ogni procedimento
        indicatore: Dichiarazioni acquisite sul totale dei procedimenti
        target: 100%
      - codice: A.2.2_R.1_M.3
        descrizione: Rotazione dei componenti delle commissioni e scelta tra esperti di comprovata competenza, anche
          esterni
        tipo: SPECIFICA
        categoria: Rotazione
        tempi: A ogni concorso
        indicatore: Commissioni con almeno un componente diverso dalla precedente
        target: 100%
  - codice: A.2.3
    descrizione: Svolgimento delle prove e valutazione dei candidati
    rischi:
    - codice: A.2.3_R.1
      evento: Inosservanza delle regole a garanzia dell'imparzialità della selezione, come l'anonimato della prova
        scritta e la predeterminazione dei criteri di valutazione
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: A.2.3_R.1_M.1
        descrizione: Predeterminazione e verbalizzazione dei criteri di valutazione prima delle prove; anonimato
          degli elaborati e prove su piattaforma digitale
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni concorso
        indicatore: Concorsi con criteri predeterminati a verbale
        target: 100%
      - codice: A.2.3_R.1_M.2
        descrizione: Formazione specifica del personale sul processo e sui rischi corruttivi
        tipo: GENERALE
        categoria: Formazione
        tempi: Annuale
        indicatore: Personale addetto formato
        target: Almeno 80% nell'anno
    - codice: A.2.3_R.2
      evento: Fuga di notizie sulle tracce delle prove
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: A.2.3_R.2_M.1
        descrizione: Predisposizione delle tracce in seduta riservata immediatamente prima della prova, con estrazione
          pubblica
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni prova
        indicatore: Prove con estrazione pubblica della traccia
        target: 100%
  - codice: A.2.4
    descrizione: Approvazione della graduatoria e assunzione dei vincitori
    procedimento: PRC-0001
  - codice: A.2.5
    descrizione: Verifica dei requisiti dichiarati dai vincitori
    rischi:
    - codice: A.2.5_R.1
      evento: Omessa verifica dei titoli e dei requisiti dichiarati
      fattore_abilitante: Scarsa responsabilizzazione interna
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: A.2.5_R.1_M.1
        descrizione: Controllo a campione delle dichiarazioni sostitutive (artt. 71-72 d.P.R. 445/2000), con criteri
          di estrazione predeterminati
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Semestrale
        indicatore: Dichiarazioni controllate sul totale
        target: Almeno 10%
- codice: A.3
