# Processi standard dell'area A: ricavati dalla mappatura del Comune di Lucca
# (PTPCT 2026-2028), senza le strutture e le valutazioni dell'ente (la valutazione
# è solo proposta: entra nei rischi nuovi e l'ente la rivede).
area: A
processi:
- codice: A.1
  denominazione: Assegnazione definitiva di alloggi di edilizia residenziale pubblica
  tempi: Assegnazione dell'alloggio ai beneficiari entro 60 giorni dalla sua disponibilità
  attori_esterni: E.r.p. Lucca S.r.l. - inquilini alloggi edilizia residenziale pubblica
  attivita:
  - codice: A.1.1
    descrizione: verifica dell'eventuale disponibilità di un alloggio adatto a coloro che sono collocati
      in posizione utile all'interno della graduatoria per l'assegnazione di alloggi di edilizia residenziale
      pubblica
    rischi:
    - codice: A.1.1_R.1
      evento: Erronea valutazione dell'adeguatezza degli alloggi disponibili in relazione al nucleo beneficiario
        e alle sue caratteristiche
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Alto, '3': Alto, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: A.1.1_R.1_M.1
        descrizione: Chiedere all'ente gestore E.r.p. Lucca S.r.l. un elenco aggiornato trimestralmente
          degli alloggi pronti e disponibili per l'assegnazione con il dettaglio, per ciascuno, dell'ubicazione,
          dei vani utili, della composizione dell'alloggio (stanze presenti) e della metratura di ciascuna
          stanza
  - codice: A.1.2
    descrizione: verifica del mantenimento dei requisiti necessari previsti per l'assegnazione tramite
      richiesta di documentazione all'utente
    rischi:
    - codice: A.1.2_R.1
      evento: Erronea valutazione della documentazione richiesta all'utente per la verifica del mantenimento
        dei requisiti
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Alto, '4': Basso, '5': Basso, '6': Basso, '7': Medio,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Medio, '4': Basso}
      misure:
      - codice: A.1.2_R.1_M.1
        descrizione: Predisporre una griglia contenente in maniera schematica tutte le prerogative previste
          dalla normativa di riferimento da consultare durante il controllo del mantenimento dei requisiti
          del soggetto in posizione utile in graduatoria propedeutico all'assegnazione di un alloggio
        categoria: Controllo
  - codice: A.1.3
    descrizione: Proposta dell'alloggio all'avente diritto; in caso di accettazione, predisposizione di
      determina dirigenziale di assegnazione
  - codice: A.1.4
    descrizione: in caso di rifiuto da parte dell'avente diritto, valutazione della sussistenza di una
      valida motivazione. Se la rinuncia non è giustificata, cancellazione dalla graduatoria
- codice: A.2
  denominazione: Consegna carte di identità e autenticazione di firme a domicilio
  tempi: 1 settimana
  attori_esterni: congiunti/tutori
  attivita:
