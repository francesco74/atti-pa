          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Alto, '4': Basso}
      misure:
      - codice: B.4.2_R.1_M.1
        descrizione: Applicazione del principio della rotazione almeno annuale del personale assegnato
          all'espletamento di tale fase;Suddivisione tra il personale preposto ai riscontri contabili
          e quello che provvede alle verifiche delle inadempienze.
        categoria: Rotazione
  - codice: B.4.3
    descrizione: 3. Rilascio, tramite la piattaforma, della certificazione del credito richiesta
