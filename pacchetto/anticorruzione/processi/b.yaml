- codice: B.4
  denominazione: Rilascio certificazioni di certezza, liquidità ed esigibilità del credito relativo a
    contratti di somministrazione, fornitura, appalti e prestazioni professionali
  tempi: 30 gg come previsto dall'art.9 c.3 bis D.L.n.185/2008 convertito da L.n.2/2009 e successive modificazioni
  attori_esterni: FORNITORI
  attivita:
