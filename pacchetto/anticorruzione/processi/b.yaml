      misure:
      - codice: B.2.1_R.1_M.1
        descrizione: Dichiarazione di assenza di conflitto di interessi di RUP, componenti della commissione, direttore
          dei lavori o dell'esecuzione e collaboratori, aggiornata nel corso della procedura e verificata a campione
          (art. 16 d.lgs. 36/2023)
        tipo: GENERALE
        categoria: Disciplina del conflitto di interessi
        tempi: A ogni procedura
        indicatore: Dichiarazioni acquisite e verificate a campione
        target: 100% acquisite, almeno 10% verificate
      - codice: B.2.1_R.1_M.2
        descrizione: Nomina del RUP con atto motivato sul possesso dei requisiti (allegato I.2 d.lgs. 36/2023)
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni procedura
        indicatore: Nomine con verifica dei requisiti
        target: 100%
  - codice: B.2.2
    descrizione: Definizione dell'oggetto, delle specifiche tecniche e dei requisiti di partecipazione
    rischi:
    - codice: B.2.2_R.1
      evento: Definizione dei requisiti di partecipazione e delle specifiche tecniche al fine di favorire un'impresa
