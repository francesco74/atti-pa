# Processi standard dell'area B per comuni e province. La valutazione
# di ogni rischio è una proposta: entra nei rischi nuovi e l'ente la rivede.
area: B
processi:
- codice: B.1
  denominazione: Programmazione triennale dei lavori e degli acquisti di beni e servizi
  descrizione: Programma triennale dei lavori pubblici e programma triennale degli acquisti (art. 37 d.lgs. 36/2023)
  tempi: Annuale, con il bilancio
  attori_esterni: Organi di indirizzo
  attivita:
  - codice: B.1.1
    descrizione: Rilevazione dei fabbisogni delle strutture e quadro esigenziale
  - codice: B.1.2
    descrizione: Redazione dei programmi e loro aggiornamento
    rischi:
    - codice: B.1.2_R.1
      evento: Programmazione non aderente ai fabbisogni effettivi, orientata a interessi particolari, o ricorso
        sistematico agli acquisti non programmati e alle proroghe
      fattore_abilitante: Mancata attuazione del principio di distinzione tra politica e amministrazione
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: B.1.2_R.1_M.1
        descrizione: Programmazione triennale e aggiornamento annuale degli acquisti e dei lavori, con verifica
          degli acquisti fuori programma
        tipo: SPECIFICA
        categoria: Regolamentazione
        tempi: Annuale
        indicatore: Acquisti non programmati sul totale
        target: ≤ 10%
      - codice: B.1.2_R.1_M.2
        descrizione: Monitoraggio delle scadenze dei contratti in essere per avviare per tempo le nuove procedure
          ed evitare proroghe
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Semestrale
        indicatore: Proroghe tecniche sul totale dei contratti scaduti
        target: ≤ 10%
  - codice: B.1.3
    descrizione: Pubblicazione dei programmi sulla piattaforma e in Amministrazione trasparente
    rischi:
    - codice: B.1.3_R.1
      evento: Mancata o ritardata pubblicazione dei programmi
      fattore_abilitante: Mancanza di trasparenza
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso, '8': Basso,
          '9': Basso}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: B.1.3_R.1_M.1
        descrizione: Gestione dell'intero ciclo del contratto sulle piattaforme di approvvigionamento digitale certificate
          (artt. 19-36 d.lgs. 36/2023), con verifica a campione dei dati trasmessi alla BDNCP
        tipo: SPECIFICA
        categoria: Semplificazione
        tempi: A ogni procedura
        indicatore: Procedure interamente gestite su PAD
        target: 100%
- codice: B.2
  denominazione: Progettazione della procedura di affidamento
  descrizione: Definizione dell'oggetto, dell'importo stimato, della procedura e dei criteri di aggiudicazione
  tempi: Prima dell'avvio della procedura
  attivita:
  - codice: B.2.1
    descrizione: Nomina del responsabile unico di progetto
    rischi:
    - codice: B.2.1_R.1
      evento: Nomina di un RUP privo dei requisiti o in conflitto di interessi
      fattore_abilitante: Scarsa responsabilizzazione interna
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
