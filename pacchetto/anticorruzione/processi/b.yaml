        target: 100% acquisite, almeno 10% verificate
  - codice: B.2.3
    descrizione: Stima del valore e scelta della procedura
    rischi:
    - codice: B.2.3_R.1
      evento: Sottostima del valore dell'appalto o scelta di una procedura non giustificata per restringere la concorrenza
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
