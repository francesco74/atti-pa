      delle Finanze dell'istanza di certificazione del credito
  - codice: B.4.2
    descrizione: '2. Verifica dei requisiti di legge richiesti per il rilascio della certificazione: -
      liquidazione del credito da parte del responsabile del procedimento - verifica, per crediti di importo
      superiore a 5.000╒, di eventuali inadempienze tributarie da parte del soggetto beneficiario del
      pagamento stesso, mediante apposita richiesta da inoltrare a Equitalia Servizi S.p.a'
