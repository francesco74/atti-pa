# Processi standard dell'area C: ricavati dalla mappatura del Comune di Lucca
# (PTPCT 2026-2028), senza le strutture e le valutazioni dell'ente (la valutazione
# è solo proposta: entra nei rischi nuovi e l'ente la rivede).
area: C
processi:
- codice: C.1
  denominazione: Affidamenti di opere, lavori, servizi e forniture pubblici (indipentemente dal valore
    e dalla tipologia)
  tempi: Entro i termini di legge
  attori_esterni: Operatori economici
  attivita:
  - codice: C.1.1
    descrizione: 'Quadro esigenziale: Individuazione delle OO.LL.SS e FF da inserire nelle relative programmazioni'
  - codice: C.1.2
    descrizione: Adozione della deliberazione di GM e successiva approvazione del C.C per SS.FF.PP (da
      Euro 140.000/00)
  - codice: C.1.3
    descrizione: Adozione della deliberazione di GM e successiva approvazione del C.C per OO.LL.PP (da
      Euro 100.000/00)
  - codice: C.1.4
    descrizione: Progettazione, individuazione delle specifiche tecniche, dei requisiti di partecipazione
      e criterio di selezione (oepv o prezzo più basso)
    rischi:
    - codice: C.1.4_R.1
      evento: Definizioni delle specifiche in ordine alle esigenze individuate dal RUP e scelta del criterio
        inadeguata alle esigenze dell'ente
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: C.1.4_R.1_M.1
        descrizione: Riscontro e adozione dei parametri prezzo - qualità ex Convenzioni quadro di Consip
          e degli altri Soggetti Aggregatori (Regione Toscana e Città Metropolitana di Firenze), Prezzari
          regionali, Prezzari ANAC se presenti, ovvero rispetto della disciplina speciale ove ricorra.
          Rispetto dell'art. 95 d. lgs 50/2016 e delle linee guida ANAC n. 2/2016
        categoria: Regolamentazione
  - codice: C.1.5
    descrizione: DD a contrarre per le procedure negoziate/aperte/ristrette
  - codice: C.1.6
    descrizione: Individuazione degli operarori economici da invitare
    rischi:
    - codice: C.1.6_R.1
      evento: Scelta degli operatori da invitare fino alla soglia di rilevanza comunitaria
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Alto, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: C.1.6_R.1_M.1
        descrizione: Atto regolatorio dell'Elenco degli operatori economici per forniture servizi e lavori
          approvato con delibera di Giunta n. 81 del 31.08.2021 e successivi aggiornamenti.
  - codice: C.1.7
    descrizione: Invito su sistema di negoziazione
  - codice: C.1.8
    descrizione: Acquisizione su sistema di acquisto
  - codice: C.1.9
    descrizione: Seggio di gara (esame busta amministrativa, soccorsi istruttori, DD ammissione ed esclusione,
      comunicazione ai partecipanti, verifica offerte economiche (in caso di prezzo più basso)
    rischi:
    - codice: C.1.9_R.1
      evento: Presieduto dal Responsabile della procedura di gara individuato in ambito della U.O. A.3
        (che può o meno coincidere con il RUP se acquisto esperito dal Provveditorato)
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Alto, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: C.1.9_R.1_M.1
        descrizione: Riferimento puntuale e rigoroso agli artt. 94, 95, 97, 98 e art. 100 del d.lgs 36/2023
          nonché al Patto di integrità adottato con delibera di Giunta Comunale n. 235 del 31/08/2022.
  - codice: C.1.10
    descrizione: Nomina commissione per oepv
  - codice: C.1.11
    descrizione: Valutazione offerte tecniche ed economiche in caso di oepv (Commissione di gara)
  - codice: C.1.12
    descrizione: Congruità dell'offerta e valutazione costo della manodopera (RUP)
  - codice: C.1.13
    descrizione: Determinazione di affidamento/aggiudicazione
  - codice: C.1.14
    descrizione: Controlli di ordine generale sull'aggiudicatario
  - codice: C.1.15
    descrizione: Controlli speciali (tecnico-professionali) sull'aggiudicatario
  - codice: C.1.16
    descrizione: Adempimenti inerenti e conseguenti l'affidamento
  - codice: C.1.17
    descrizione: Redazione contratto
  - codice: C.1.18
    descrizione: Sottoscrizione del Contratto affidamenti diretti
  - codice: C.1.19
    descrizione: Sottoscrizione Contratto procedure negoziate/aperte/ristrette
  - codice: C.1.20
    descrizione: Gestione del contratto, liquidazione delle fatture e relativi adempimenti
    rischi:
    - codice: C.1.20_R.1
      evento: Verifica quali-quantitativa dell'opera, del lavoro, della fornitura o del servizio da parte
        del Responsabile Unico del Procedimento (RUP) e del Direttore dell'esecuzione del contratto (DEC),
        quando previsto.
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: C.1.20_R.1_M.1
        descrizione: 'Verifica puntuale da parte del RUP/ del DEC sul rispetto degli adempimenti contrattuali.
          In caso di affidamenti gestiti dal Provveditorato: eventuali segnalazioni da parte di coloro
          che sono a diretto contatto con la prestazione contrattuale ovvero utilizzano i beni forniti
          di anomalie ed irregolarità sono sottoposte immediatamente al RUP/DEC.'
        categoria: Controllo
  - codice: C.1.21
    descrizione: Emissione di Certificato di regolare esecuzione/collaudo
    rischi:
    - codice: C.1.21_R.1
      evento: Certificazione dal parte del RUP che il servizio/la fornitura è stato/a svolto/a nel pieno
        rispetto dei tempi e nei modi di esecuzione previsti nel contratto
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: C.1.21_R.1_M.1
        descrizione: Le attività del DEC sono presidiate e dirette dal RUP
  - codice: C.1.22
    descrizione: Emissione della Verifica di conformità
    rischi:
    - codice: C.1.22_R.1
      evento: Certificazione dal parte del RUP che il servizio/la fornitura è stato/a svolto/a nel pieno
        rispetto dei tempi e nei modi di esecuzione previsti nel contratto.
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: C.1.22_R.1_M.1
        descrizione: Le attività del DEC sono presidiate e dirette dal RUP
  - codice: C.1.23
    descrizione: Resoconto della gestione finanziaria OO, LL, SS e FF
