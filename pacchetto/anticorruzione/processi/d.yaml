# Processi standard dell'area D: ricavati dalla mappatura del Comune di Lucca
# (PTPCT 2026-2028), senza le strutture e le valutazioni dell'ente (la valutazione
# è solo proposta: entra nei rischi nuovi e l'ente la rivede).
area: D
processi:
- codice: D.1
  denominazione: Concorso pubblico
  tempi: Sei mesi dalla data di effettuazione delle prove scritte o, se trattasi di selezioni per titoli,
    dalla data della prima convocazione. (Art. 17 Allegato L al Regolamento sull'ordinamento degli uffici
    e dei servizi)
  attori_esterni: Pubblicazione sul portale InPA e sito istituzionale dell'Ente e secondo quanto previsto
    dal Regolamento delle Procedure Selettive (Allegato L del Regolamento sull'Ordinamento degli Uffici
    e dei Servizi dell'Ente)
  attivita:
  - codice: D.1.1
    descrizione: Predisposizione bando di concorso in attuazione della programmazione triennale del fabbisogno
      di personale.
    rischi:
    - codice: D.1.1_R.1
      evento: Predisposizione di un bando contenente requisiti che possano avvantaggiare particolari categorie
        di soggetti.
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Basso, '3': Alto, '4': Basso, '5': Medio, '6': Basso, '7': Basso,
          '8': Medio, '9': Medio}
        impatto: {'1': Medio, '2': Alto, '3': Alto, '4': Basso}
      misure:
      - codice: D.1.1_R.1_M.1
        descrizione: Il bando viene definito congiuntamente dal Dirigente del Personale e dal Dirigente
          Responsabile del servizio a cui le risorse sono destinate.
  - codice: D.1.2
    descrizione: Determinazione dirigenziale di approvazione del bando.
  - codice: D.1.3
    descrizione: Pubblicazione sul portale InPA e sito istituzionale dell'Ente e secondo quanto previsto
      dal Regolamento delle Procedure Selettive (Allegato L del Regolamento sull'Ordinamento degli Uffici
      e dei Servizi dell'Ente)
  - codice: D.1.4
    descrizione: Ricezione delle domande di partecipazione attraverso il portale InPA. Determinazione
      dirigenziale di ammissione con riserva ed eventuale esclusione dei candidati. Comunicazione ai concorrenti
      della esclusione e pubblicazione sul portale InPA e sito istituzionale dell'Ente dei concorrenti
      ammessi con riserva ed eventuali esclusi.
    rischi:
    - codice: D.1.4_R.1
      evento: Ammissione di soggetto che non ha i requisiti o esclusione di soggetto che ha i requisiti
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Basso, '3': Alto, '4': Basso, '5': Medio, '6': Basso, '7': Basso,
          '8': Basso, '9': Medio}
        impatto: {'1': Basso, '2': Alto, '3': Alto, '4': Basso}
      misure:
      - codice: D.1.4_R.1_M.1
        descrizione: Le domande vengono controllate da più dipendenti dell'Ufficio Personale.Nella determinazione
          dirigenziale di ammissione ed esclusione devono essere indicati i candidati ammessi e quelli
          eventualmente esclusi. Ad ogni candidato escluso viene inviata apposita nota. Tutti i candidati
          la cui domanda sia pervenuta tramite portale nei termini perentori di scadenza, sono ammessi
          con riserva alla selezione, sulla base delle dichiarazioni sottoscritte. L'accertamento del
          possesso dei requisiti viene fatto ai sensi dell'art. 15 del Regolamento.
        categoria: Regolamentazione
  - codice: D.1.5
    descrizione: Nomina della commissione esaminatrice.
    rischi:
    - codice: D.1.5_R.1
      evento: Nomina di soggetti che abbiano un certo tipo di parentela o affinità con i soggetti partecipanti.
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Basso, '3': Alto, '4': Basso, '5': Medio, '6': Basso, '7': Basso,
          '8': Basso, '9': Medio}
        impatto: {'1': Basso, '2': Alto, '3': Alto, '4': Basso}
      misure:
      - codice: D.1.5_R.1_M.1
        descrizione: La composizione e il funzionamento delle Commissioni è disciplinato dal Regolamento
          delle Procedure Selettive (Allegato L del Regolamento sull'Ordinamento degli Uffici e dei Servizi
          dell'Ente).
        categoria: Regolamentazione
  - codice: D.1.6
    descrizione: Predisposizione fascicolo degli atti del concorso per la Commissione Esaminatrice.
  - codice: D.1.7
    descrizione: Ausilio alla Commissione Esaminatrice per eventuali problemi o pareri durante lo svolgimento
      del concorso.
  - codice: D.1.8
    descrizione: Svolgimento procedura di selezione (valutazione dei titoli e svolgimento prove la cui
      responsabilità è in capo alla Commissione Esaminatrice). Formulazione graduatoria di merito da parte
      della Commissione esaminatrice e trasmissione atti all'Ufficio personale.
    rischi:
    - codice: D.1.8_R.1
      evento: Attribuzione di maggiore/minor punteggio nella valutazione dei titoli
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Basso, '3': Alto, '4': Basso, '5': Medio, '6': Basso, '7': Basso,
          '8': Basso, '9': Medio}
        impatto: {'1': Basso, '2': Alto, '3': Alto, '4': Basso}
      misure:
      - codice: D.1.8_R.1_M.1
        descrizione: I criteri stabiliti dalla Commissione, nell'ambito di quanto previsto dal bando di
          concorso, per la valutazione dei titoli, saranno pubblicati sul portale InPA e nella pagina
          del sito web.
    - codice: D.1.8_R.2
      evento: Far conoscere preventivamente i contenuti della prova di esame ai candidati
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Basso, '3': Alto, '4': Basso, '5': Medio, '6': Basso, '7': Basso,
          '8': Basso, '9': Medio}
        impatto: {'1': Basso, '2': Alto, '3': Alto, '4': Basso}
      misure:
      - codice: D.1.8_R.2_M.1
        descrizione: La disciplina delle prove è stabilita dal Regolamento delle Procedure Selettive (Allegato
          L del Regolamento sull'Ordinamento degli Uffici e dei Servizi dell'Ente).La Commissione propone
          tre tracce per ciascuna prova scritta. Deve essere garantita analoga complessità e rilevanza
          nella formulazione dei quesiti. Le tracce sono segrete, elaborate con modalità digitale e ne
          è vietata la divulgazione. L'estrazione della prova è effettuata da almeno 2 candidati.
        categoria: Regolamentazione
  - codice: D.1.9
    descrizione: Ricevimento atti della Commissione Esaminatrice.
  - codice: D.1.10
    descrizione: Predisposizione e adozione determinazione di approvazione dei lavori della Commissione.
  - codice: D.1.11
    descrizione: Approvazione graduatoria finale con applicazione delle eventuali riserve e preferenze
      e nomina dei vincitori.
    rischi:
    - codice: D.1.11_R.1
      evento: Avvantaggiare/svantaggiare i singoli concorrenti nella fase di applicazione delle riserve
        /preferenze.
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Basso, '3': Alto, '4': Basso, '5': Medio, '6': Basso, '7': Basso,
          '8': Basso, '9': Medio}
        impatto: {'1': Basso, '2': Alto, '3': Alto, '4': Basso}
      misure:
      - codice: D.1.11_R.1_M.1
        descrizione: Indicazione specifiche delle singole posizioni di riserva/precedenza nella determinazione
          di approvazione della graduatoria finale.
