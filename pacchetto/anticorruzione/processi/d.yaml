- codice: D.6
  denominazione: Erogazione di compensi e retribuzioni per dipendenti e Amministratori e denunce mensili
    e annuali relative ai compensi nonché ai versamenti contributivi effettuati
  attivita:
  - codice: D.6.1
    descrizione: Erogazione delle retribuzioni ai dipendenti dell'Ente. Erogazione delle indennità per
      gli Amministratori in carica. Effettuazione dei versamenti contributivi mensili relativi alle retribuzioni
      percepite. Effettuazione delle denunce mensili e annuali relative ai contributi versati
- codice: D.7
  denominazione: Valutazione della performance dei dirigenti, PO e dipendenti privi di incarico
  tempi: Entro 30 giorni dalla validazione della Relazione sulla performance da parte del NDV, salvo slittamento
    dei tempi per ricorsi dei dipendenti
  attori_esterni: NdVGestore conservazione digitale della documentazione
  attivita:
  - codice: D.7.1
    descrizione: Predisposizione ed aggiornamento SMVP
  - codice: D.7.2
    descrizione: Validazione da parte del NDV del documento SMVP
  - codice: D.7.3
    descrizione: Comunicazione e cura dei rapporti con gli uffici
  - codice: D.7.4
    descrizione: Predisposizione schede, con i fattori valutativi, per la valutazione dei dirigenti e
      dei dipendenti ( a supporto ai dirigenti, per valutare i propri collaboratori e supporto al NDV/
      Sindaco per la valutazione dei Dirigenti)
  - codice: D.7.5
    descrizione: Raccolta schede di valutazione e verifica della presenza di tutti gli elementi (firme
      valutatore e valutato, data certa di consegna e presa visione, assegnazione punteggio)
  - codice: D.7.6
    descrizione: Caricamento dato sul data base e verifica di eventuali anomalie
  - codice: D.7.7
    descrizione: Elaborazione file valutazione definitive e trasmissione all'ufficio preposto all'erogazione
      dei premi correlati alla performance
  - codice: D.7.8
    descrizione: Archiviazione e conservazione schede di valutazione dirigenti e dipendenti
- codice: D.8
  denominazione: Rimborso Spese sostenute da Amministratori e dipendenti per missioni autorizzate nell'interesse
    dell'Ente
  attivita:
  - codice: D.8.1
    descrizione: Preventiva ricezione dell'autorizzazione alla missione da parte dei soggetti titolati.
      Successiva ricezione delle pezze d'appoggio attestanti le spese sostenute in occasione della missione
      e relativo controllo sulla ammissibilità delle spese da rimborsare. Rimborso della missione sul
      cedolino.
- codice: D.9
  denominazione: Corresponsione di trattamenti accessori per dipendenti del comparto e della dirigenza
  attivita:
  - codice: D.9.1
    descrizione: Verifica del rispetto dei limiti individuali annuali di lavoro straordinario. Verifica
      del rispetto di requisiti di legge, del CCNL nazionale e/o decentrato nonché di regolamenti per
      l'erogazione dei trattamenti accessori.
- codice: D.10
  denominazione: Cessazione dal servizio per qualsiasi causa e conseguente gestione del trattamento pensionistico
    e di TFR/TFS
  attivita:
  - codice: D.10.1
    descrizione: Comunicazione della risoluzione unilaterale del rapporto di lavoro al dipendente che
      ha maturato i requisiti pensionistici con un preavviso di 6 mesi e conseguente inserimento, nella
      posizione assicurativa, delle retribuzioni relative agli ultimi 6 mesi di impiego prima della cessazione
      (anticipo DMA). Inserimento dati di ultimo miglio per il calcolo del TFS/TFR.
- codice: D.11
  denominazione: Redazione CU dipendenti
  attivita:
  - codice: D.11.1
    descrizione: Invio della CU ordinaria all'AE entro il termine perentorio stabilito. Successivo invio
      delle CU modello sintetico ai dipendenti e ai percettori di redditi assimilati.
- codice: D.12
  denominazione: Certificazioni stipendio per richieste cessione del quinto
  attivita:
  - codice: D.12.1
    descrizione: Certificazione stipendiale rilasciata ai dipendenti e/o finanziarie su delega del dipendente
      per rilascio finanziamenti.
- codice: D.13
  denominazione: Certificazioni e attestazioni posizioni assicurative per pratiche pensionistiche, ricongiunzioni
    e riscatti del personale a tempo determinato e indeterminato
  attivita:
  - codice: D.13.1
    descrizione: Ricezione delle richieste di sistemazione posizione assicurativa da parte di altri enti,
      degli interessati e/o da parte dell'INPS. Conseguente istruttoria e ricostruzione della posizione
      richiesta sia da un punto di vista giuridico che economico. Eventuale correzione dei dati in caso
      di inesattezze sull'applicativo passweb e conseguente certificazione della posizione.
- codice: D.14
  denominazione: Denunce infortuni e malattie professionali dipendenti
  attivita:
  - codice: D.14.1
    descrizione: Tempestiva denuncia (entro 48 h dall'evento) all'istituto nazionale assicurazione contro
      gli infortuni sul lavoro e successivi adempimenti
- codice: D.15
  denominazione: Certificazioni stipendio ex art. 547 cpc
  attivita:
  - codice: D.15.1
    descrizione: Dichiarazione resa nei confronti del creditore procedente in cui si specifica l'ammontare
      dello stipendio netto del soggetto pignorato e si dichiarano eventuali e ulteriori pignoramenti
      e/o cessioni già in corso
