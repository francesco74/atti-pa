- codice: D.3
  denominazione: Assunzione personale di ruolo per mobilità volontaria
  tempi: entro 30 gg. dalla determinazione contenente l'individuazione dei soggetti scelti per la copertura
    dei posti, fatti salvi eventuali altri accordi con l'Amministrazione cedente se compatibili con le
    esigenze organizzative
  attivita:
  - codice: D.3.1
    descrizione: Predisposizione avviso di selezione pubblica in attuazione della programmazione triennale
      del fabbisogno di personale, dove vengono indicati i posti/profili per i quali si procede a selezione,
      i requisiti di partecipazione, nonché le modalità di selezione e pubblicazione sulla piattaforma
      InPA e sul sito istituzionale dell'Ente e secondo quanto previsto dal Regolamento delle Procedure
      Selettive (Allegato L del Regolamento sull'Ordinamento degli Uffici e dei Servizi dell'Ente)
    rischi:
    - codice: D.3.1_R.1
      evento: Predisposizione di un bando contenente requisiti troppo specifici che possano avvantaggiare
        particolari categorie di soggetti.
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Basso, '3': Basso, '4': Basso, '5': Medio, '6': Basso, '7': Basso,
          '8': Medio, '9': Medio}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: D.3.1_R.1_M.1
        descrizione: Il bando viene definito congiuntamente dal Dirigente del Personale e dal Dirigente
          Responsabile del servizio a cui le risorse sono destinate. Alle selezioni per mobilità volontaria
          - ancorché non qualificabili strettamente quali concorsi pubblici - si applicano le disposizioni
          di carattere generale di cui al Regolamento delle Procedure Selettive (Allegato L del Regolamento
          sull'Ordinamento degli Uffici e dei Servizi dell'Ente). ritenute compatibili con la disciplina
          normativa specifica di riferimento.
        categoria: Regolamentazione
