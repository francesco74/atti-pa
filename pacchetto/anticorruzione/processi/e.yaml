- codice: E.4
  denominazione: Emissione mandati di pagamento
  tempi: Termini previsti dal D.Lgs.231/2002 a sua volta condizionati dalle disponibilità di cassa
  attori_esterni: FORNITORI
  attivita:
  - codice: E.4.1
    descrizione: Acquisizione degli atti di liquidazione predisposti dai vari uffici comunali
  - codice: E.4.2
    descrizione: Effettuazione, secondo i princìpi e le procedure della contabilità pubblica, dei controlli
      e riscontri amministrativi, contabili e fiscali sugli atti di liquidazione.
    rischi:
    - codice: E.4.2_R.1
      evento: Non effettuazione dei controlli contabili necessari a verificare il sussistere dei requisiti
        di legge o effettuare controlli insufficienti o inefficaci
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte
        di pochi o di un unico soggettoScarsa responsabilizzazione interna;Inadeguatezza o assenza di
        competenze del personale addetto ai processi
      valutazione:
        probabilita: {'1': Basso, '2': Medio, '3': Alto, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: E.4.2_R.1_M.1
        descrizione: Applicazione della rotazione almeno annuale delle competenze tra il personale coinvolto;
        categoria: Rotazione
  - codice: E.4.3
    descrizione: Registrazione della liquidazione contabile nella procedura informatica utilizzata per
      la tenuta della contabilità finanziaria
  - codice: E.4.4
    descrizione: Emissione mandato di pagamento
    rischi:
    - codice: E.4.4_R.1
      evento: Pagamento di somme non dovute (per mancata verifica ai sensi dell'art 48-bis del D.P.R.
        n. 602/1973 e s.m.i. per pagamenti di importo superiore a 5.000╒; a seguito di accertata inadempienza
        ai sensi dell'art 48-bis del D.P.R. n. 602/1973 e s.m.i.; in caso di crediti pignorati)
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte
        di pochi o di un unico soggettoScarsa responsabilizzazione interna;Inadeguatezza o assenza di
        competenze del personale addetto ai processi
      valutazione:
        probabilita: {'1': Alto, '2': Medio, '3': Alto, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Alto, '4': Basso}
      misure:
      - codice: E.4.4_R.1_M.1
        descrizione: Distinzione tra il personale che effettua le verifiche Equitalia e chi effettua il
          pagamento
        categoria: Controllo
      - codice: E.4.4_R.1_M.2
        descrizione: Applicazione della rotazione almeno annuale delle competenze tra il personale coinvolto
        categoria: Rotazione
    - codice: E.4.4_R.2
      evento: Mancato rispetto dei tempi di pagamento e dell'ordine cronologico degli atti di liquidazione
        e/o data fattura- nota di debito
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte
        di pochi o di un unico soggettoScarsa responsabilizzazione interna;Inadeguatezza o assenza di
        competenze del personale addetto ai processi
      valutazione:
        probabilita: {'1': Alto, '2': Basso, '3': Alto, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Alto, '4': Basso}
      misure:
      - codice: E.4.4_R.2_M.1
        descrizione: Pubblicazione sul sito istituzionale Sez. Amministrazione Trasparente _ Pagamenti
          dell'Amministrazione dei tempi medi di pagamento e dei dati sui pagamenti
        categoria: Trasparenza
- codice: E.5
