- codice: E.6
  denominazione: Autorizzazione partecipazione dipendenti a interventi formativi fuori sede e a catalogo
  tempi: entro 30 gg. dalla richiesta
  attivita:
  - codice: E.6.1
    descrizione: 'Ricevimento della richiesta da parte del dipendente interessato a partecipare a corsi
      di formazione fuori sede su specifico modulo firmato dal proprio Dirigente all''Ufficio Personale.
      Nel modulo sono indicati: i dipendenti interessati all''intervento, la denominazione del corso,
      il nominativo dell''Agenzia Formativa, l''oggetto del corso, le date, gli orari e la sede, il costo
      complessivo e le modalità di pagamento.'
  - codice: E.6.2
    descrizione: Valutazione della richiesta tenendo conto delle risorse finanziarie a disposizione.
    rischi:
    - codice: E.6.2_R.1
      evento: Mancata valutazione della richiesta e mancata consegna della richiesta al Dirigente del
        Personale per l'autorizzazione/diniego.
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Basso, '3': Medio, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: E.6.2_R.1_M.1
        descrizione: La richiesta, compilata in ogni sua parte, dovrà essere protocollata e inviata sia
          al Dirigente del Personale che all'Ufficio Personale entro 10 giorni dalla data di svolgimento
          del corso di formazione.
        categoria: Formazione
  - codice: E.6.3
    descrizione: Autorizzazione da parte del Dirigente del Personale con apposizione della propria firma
      sul modulo.
    rischi:
    - codice: E.6.3_R.1
      evento: Autorizzare /non autorizzare la formazione richiesta al fine di avvantaggiare una determinata
        agenzia formativa
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Basso, '3': Medio, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: E.6.3_R.1_M.1
        descrizione: Nella richiesta dovrà essere motivata da parte del Dirigente al scelta del corso
          effettuando una valutazione in termini di qualità prezzo
  - codice: E.6.4
    descrizione: Adozione della Determinazione Dirigenziale di autorizzazione all'iscrizione al corso
      di formazione fuori sede e impegno di spesa e successiva liquidazione.
