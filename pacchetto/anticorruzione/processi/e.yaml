# Processi standard dell'area E per comuni e province. La valutazione
# di ogni rischio è una proposta: entra nei rischi nuovi e l'ente la rivede.
area: E
processi:
- codice: E.1
  denominazione: Accertamento dei tributi locali
  descrizione: Controllo delle dichiarazioni e dei versamenti dei tributi dell'ente (per i comuni IMU e TARI, per
    le province l'imposta provinciale di trascrizione e gli altri tributi) ed emissione degli avvisi
  tempi: Entro il quinto anno successivo
  attori_esterni: Contribuenti
  attivita:
  - codice: E.1.1
    descrizione: Bonifica delle banche dati e individuazione delle posizioni da controllare
    rischi:
    - codice: E.1.1_R.1
      evento: Selezione delle posizioni da controllare non casuale né basata su criteri, per escludere alcuni contribuenti
      fattore_abilitante: Mancanza di trasparenza
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: E.1.1_R.1_M.1
        descrizione: Piano annuale dei controlli con criteri di selezione predeterminati e incrocio delle banche
          dati (catasto, anagrafe, utenze)
        tipo: SPECIFICA
        categoria: Regolamentazione
        tempi: Annuale
        indicatore: Posizioni controllate secondo il piano
        target: 100% del piano
      - codice: E.1.1_R.1_M.2
        descrizione: Gestione informatizzata del procedimento (protocollo e gestionale) con tracciabilità di fasi,
          tempi e responsabili
        tipo: SPECIFICA
        categoria: Semplificazione
        tempi: Continuativa
        indicatore: Pratiche gestite sul gestionale
        target: 100%
  - codice: E.1.2
    descrizione: Emissione degli avvisi di accertamento
    rischi:
    - codice: E.1.2_R.1
      evento: Omissione o ritardo nell'emissione degli avvisi fino a far maturare la decadenza
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: E.1.2_R.1_M.1
        descrizione: Monitoraggio delle annualità in scadenza di decadenza e report al responsabile del tributo
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Annuale
        indicatore: Avvisi emessi entro i termini di decadenza
        target: 100%
      - codice: E.1.2_R.1_M.2
        descrizione: Separazione tra chi istruisce e chi adotta il provvedimento, con doppia sottoscrizione
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni provvedimento
        indicatore: Provvedimenti con doppia sottoscrizione
        target: 100%
    - codice: E.1.2_R.2
      evento: Sottostima del dovuto o annullamento di posizioni senza motivazione
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte di pochi
        o di un unico soggetto
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: E.1.2_R.2_M.1
        descrizione: 'Rotazione del personale addetto o, dove non possibile, misure alternative: segregazione delle
          funzioni tra istruttoria e decisione, affiancamento, condivisione delle pratiche'
        tipo: GENERALE
        categoria: Rotazione
        tempi: Programmazione triennale
        indicatore: Processi con rotazione o segregazione delle funzioni
        target: 100% dei processi ad alto rischio
      - codice: E.1.2_R.2_M.2
        descrizione: Report periodico al RPCT con i dati del processo (numero, importi, scostamenti) per l'analisi
          delle anomalie
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Semestrale
        indicatore: Report trasmessi
        target: 2 all'anno
- codice: E.2
  denominazione: Riscossione ordinaria e coattiva delle entrate
  descrizione: Riscossione dei tributi e delle entrate patrimoniali, anche tramite accertamento esecutivo
  attori_esterni: Contribuenti, concessionario della riscossione
  attivita:
  - codice: E.2.1
    descrizione: Gestione dei versamenti e degli insoluti
    rischi:
    - codice: E.2.1_R.1
      evento: Mancata attivazione della riscossione coattiva per alcuni debitori
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
