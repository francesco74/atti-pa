# Processi standard dell'area E: ricavati dalla mappatura del Comune di Lucca
# (PTPCT 2026-2028), senza le strutture e le valutazioni dell'ente (la valutazione
# è solo proposta: entra nei rischi nuovi e l'ente la rivede).
area: E
processi:
- codice: E.1
  denominazione: Accertamento tributi comunali
  tempi: termini di legge (5 anni che diventano 6 per omessa dichiarazione)
  attivita:
  - codice: E.1.1
    descrizione: Istruttoria
    rischi:
    - codice: E.1.1_R.1
      evento: Applicazione di aliquote ridotte o di agevolazioni/esenzioni non spettanti
      fattore_abilitante: Inadeguata diffusione della cultura della legalità
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Alto, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Medio}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: E.1.1_R.1_M.1
        descrizione: Utilizzo di software informatico per la elaborazione ed emissione dei provvedimenti
          che tiene traccia delle operazioni effettuate.
        categoria: Semplificazione
  - codice: E.1.2
    descrizione: Emissione provvedimento
    rischi:
    - codice: E.1.2_R.1
      evento: Omissione
      fattore_abilitante: Inadeguata diffusione della cultura della legalità
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Alto, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Medio}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: E.1.2_R.1_M.1
        descrizione: Verifica a campione incrociata delle azioni per l'individuazione delle anomalie,
          sotto la direzione del dirigente.
        categoria: Controllo
