- codice: E.10
  denominazione: Rimborso danni a privati a seguito di eventi calamitosi
  attivita:
  - codice: E.10.1
    descrizione: Recepimento normative nazionali o regionali di assegnazione contributi all'ente;avviso
      pubblico;raccolta domande di contributo;istruttoria;sopralluoghi tecnici;valutazione del danno;criteri
      di elargizione del contributo a favore dei privati
    rischi:
    - codice: E.10.1_R.1
      evento: Scorretto riconoscimento del danno e sua quantificazione. Il problema è che nonostante esista
        un regolamento regionale, la regione e lo stato gestiscono le procedure emergenziali con modalità
        ogni volta diverse.
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: E.10.1_R.1_M.1
        descrizione: Corretta applicazione dei parametri tecnici di valutazione e comparazione dei danni
          in relazione all'evento, che consentano di definire i soggetti cui assegnare il rimborso ed
          il suo ammontare. Si sottolinea che nelle ultime procedure per i danni a privati e imprese il
          compito del comune si è risolto nel pubblicizzare le informazioni. Altre volte, nella raccolta
          e trasmissione delle istanze, quest'ultima sostituita, nelle ultime emergenze, da portali gestiti
          da RT/ARTEA o altre agenzie regionali
        categoria: Formazione
