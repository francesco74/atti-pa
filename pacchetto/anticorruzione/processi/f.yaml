        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: F.3.2_R.1_M.1
        descrizione: Rilascio di attestazione dell'avvenuta presentazione del documento all'utente;Invio
          della scansione del documento al Comando accertatore per PEC.
- codice: F.4
  denominazione: Annullamento d'ufficio
  tempi: da uno a 3 giorni dalla presentazione della richiesta
  attori_esterni: cittadini
  attivita:
