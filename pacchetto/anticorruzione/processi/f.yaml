    descrizione: Ricevimento dei documento soggetti a controllo
    rischi:
    - codice: F.3.1_R.1
      evento: 'Controllo della documentazione presentata (ad esempio: omissione nella segnalazione di
        irregolarità). Invio alla Forza di Polizia che ha intimato la presentazione del documento'
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: F.3.1_R.1_M.1
        descrizione: Controllo dell'agente al front-office e dell'ufficio violazioni o della Forza di
          Polizia diversa dalla P.M. Lucca che riceve le copie per competenza;
        categoria: Controllo
  - codice: F.3.2
    descrizione: Rilascio ricevuta
    rischi:
    - codice: F.3.2_R.1
      evento: Omissione
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte
