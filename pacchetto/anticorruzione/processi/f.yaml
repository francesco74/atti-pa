# Processi standard dell'area F per comuni e province. La valutazione
# di ogni rischio è una proposta: entra nei rischi nuovi e l'ente la rivede.
area: F
processi:
- codice: F.1
  ambito: COMUNE
  denominazione: Vigilanza edilizia e repressione degli abusi
  descrizione: Accertamento degli abusi edilizi, ordinanze di demolizione e ripristino, sanzioni
  attori_esterni: Proprietari, autorità giudiziaria
  attivita:
  - codice: F.1.1
    descrizione: Ricezione delle segnalazioni e programmazione dei sopralluoghi
    rischi:
    - codice: F.1.1_R.1
      evento: Scelta discrezionale dei soggetti da controllare per favorirne o danneggiarne alcuni
      fattore_abilitante: Mancanza di trasparenza
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto,
          '10': Alto}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: F.1.1_R.1_M.1
        descrizione: Programma dei controlli con criteri predeterminati di estrazione o di rischio
        tipo: SPECIFICA
        categoria: Regolamentazione
        tempi: Annuale
        indicatore: Controlli svolti secondo il programma
        target: ≥ 80%
      - codice: F.1.1_R.1_M.2
        descrizione: Report periodico al RPCT con i dati del processo (numero, importi, scostamenti) per l'analisi
          delle anomalie
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Semestrale
        indicatore: Report trasmessi
        target: 2 all'anno
  - codice: F.1.2
    descrizione: Sopralluogo e accertamento dell'abuso
    rischi:
    - codice: F.1.2_R.1
      evento: Accordi collusivi tra chi controlla e il soggetto controllato per non rilevare le irregolarità o attenuarle
        nel verbale
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte di pochi
        o di un unico soggetto
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto,
          '10': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: F.1.2_R.1_M.1
        descrizione: Sopralluoghi svolti da almeno due addetti, con verbale e documentazione fotografica
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni sopralluogo
        indicatore: Sopralluoghi con verbale congiunto
        target: 100%
      - codice: F.1.2_R.1_M.2
        descrizione: 'Rotazione del personale addetto o, dove non possibile, misure alternative: segregazione delle
          funzioni tra istruttoria e decisione, affiancamento, condivisione delle pratiche'
        tipo: GENERALE
        categoria: Rotazione
        tempi: Programmazione triennale
        indicatore: Processi con rotazione o segregazione delle funzioni
        target: 100% dei processi ad alto rischio
      - codice: F.1.2_R.1_M.3
        descrizione: Rispetto del codice di comportamento dell'ente, con le regole specifiche per chi opera nel
          processo
        tipo: GENERALE
        categoria: Definizione e promozione dell'etica e di standard di comportamento
        tempi: Annuale
        indicatore: Violazioni accertate e procedimenti disciplinari avviati
        target: Monitoraggio annuale
  - codice: F.1.3
    descrizione: Ordinanza di demolizione o di ripristino ed esecuzione d'ufficio
    rischi:
    - codice: F.1.3_R.1
      evento: Mancata adozione o esecuzione delle ordinanze di demolizione, con il consolidarsi degli abusi
      fattore_abilitante: Scarsa responsabilizzazione interna
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto,
          '10': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: F.1.3_R.1_M.1
        descrizione: Registro degli abusi accertati con lo stato delle ordinanze e report periodico al RPCT
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Semestrale
        indicatore: Ordinanze eseguite sul totale
        target: Monitoraggio semestrale
      - codice: F.1.3_R.1_M.2
        descrizione: Trasmissione mensile dell'elenco degli abusi alla prefettura e all'autorità giudiziaria (art.
          31 d.P.R. 380/2001)
