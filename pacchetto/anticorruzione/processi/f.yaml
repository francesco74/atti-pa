# Processi standard dell'area F: ricavati dalla mappatura del Comune di Lucca
# (PTPCT 2026-2028), senza le strutture e le valutazioni dell'ente (la valutazione
# è solo proposta: entra nei rischi nuovi e l'ente la rivede).
area: F
processi:
- codice: F.1
  denominazione: Ordinanze ingiunzioni in materia di occupazioni abusive di spazi ed aree pubbliche
  tempi: Entro 5 anni dall'accertamento del fatto il procedimento per il recupero è chiuso
  attivita:
  - codice: F.1.1
    descrizione: Ricezione eventuale dalla PM
  - codice: F.1.2
    descrizione: Istruttoria con analisi delle eventuali difese del trasgressore
    rischi:
    - codice: F.1.2_R.1
      evento: Erronea analisi dei presupposti/circostanze di fatto e di diritto
      fattore_abilitante: Inadeguata diffusione della cultura della legalità
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Medio, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Medio, '4': Basso}
      misure:
      - codice: F.1.2_R.1_M.1
        descrizione: Verifica a campione incrociata delle pratiche da parte del personale d'ufficio sotto
          la direzione del Dirigente ed adozione di provvedimento motivato nella forma dell'ordinanza
          ingiunzione a norma della legge 689/81
        categoria: Controllo
  - codice: F.1.3
    descrizione: Emissione ordinanza ingiunzione di pagamento o provvedimento di archiviazione
    rischi:
    - codice: F.1.3_R.1
      evento: Tardività
      fattore_abilitante: Inadeguata diffusione della cultura della legalità
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Medio, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Medio, '4': Basso}
      misure:
      - codice: F.1.3_R.1_M.1
        descrizione: Verifica del rispetto dei tempi procedimentali al fine di evitare la protrazione
          illegittima dei tempi di conclusione dei procedimenti
        categoria: Controllo
- codice: F.2
  denominazione: Partecipazione all'attività di accertamento dei tributi erariali
  tempi: potere di segnalazione - termini correlati al tributo evaso
  attori_esterni: ADE - GdF
  attivita:
  - codice: F.2.1
    descrizione: Elaborazione ed invio della segnalazione qualificata di anomalia alle strutture competenti
      interne o esterne all'Ente
    rischi:
    - codice: F.2.1_R.1
      evento: Mancato invio di segnalazione qualificata sussistente.Disparità di trattamento
      fattore_abilitante: Inadeguata diffusione della cultura della legalità
      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Medio, '4': Basso, '5': Basso, '6': Basso, '7': Basso,
          '8': Basso, '9': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Medio, '4': Basso}
      misure:
      - codice: F.2.1_R.1_M.1
        descrizione: Utilizzo di software informatico, che consente la tracciabilità dei soggetti che
          operano sul sistema, per la individuazione delle posizioni dubbie e per la elaborazione delle
          segnalazioni qualificate.Verifica a campione delle pratiche da parte del personale d'ufficio,
          secondo rotazione casuale, sotto la direzione del dirigente.
        categoria: Rotazione
- codice: F.3
  denominazione: Visura dei documenti risultanti mancanti in sede di controllo su strada
  tempi: 20 giorni per presentare la documentazione ad un comando di Polizia
  attori_esterni: cittadini, altri comandi che ricevono la documentazione che deve essere presentata presso
    il Comando di Polizia Municipale di Lucca
  attivita:
