# Processi standard dell'area H per comuni e province. La valutazione
# di ogni rischio è una proposta: entra nei rischi nuovi e l'ente la rivede.
area: H
processi:
- codice: H.1
  denominazione: Affidamento degli incarichi di patrocinio legale
  descrizione: Scelta dell'avvocato esterno per la difesa dell'ente in giudizio
  attori_esterni: Avvocati, controparti
  attivita:
  - codice: H.1.1
    descrizione: Decisione di resistere o agire in giudizio
    rischi:
    - codice: H.1.1_R.1
      evento: Decisione di non costituirsi in giudizio o di non impugnare per favorire la controparte
      fattore_abilitante: Mancata attuazione del principio di distinzione tra politica e amministrazione
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio, '10': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: H.1.1_R.1_M.1
        descrizione: Motivazione puntuale del provvedimento, con richiamo dei presupposti e dei criteri applicati
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni provvedimento
        indicatore: Provvedimenti con motivazione completa ai controlli successivi
        target: 100%
      - codice: H.1.1_R.1_M.2
        descrizione: Relazione dell'ufficio competente sulle ragioni dell'ente prima della decisione
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni giudizio
        indicatore: Decisioni con relazione
        target: 100%
  - codice: H.1.2
    descrizione: Scelta dell'avvocato e determinazione del compenso
    rischi:
    - codice: H.1.2_R.1
      evento: Incarichi fiduciari ripetuti agli stessi professionisti senza rotazione e con compensi non predeterminati
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte di pochi
        o di un unico soggetto
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto,
          '10': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: H.1.2_R.1_M.1
        descrizione: Elenco aperto di avvocati con criteri di scelta, rotazione e compensi secondo i parametri ministeriali
        tipo: SPECIFICA
        categoria: Regolamentazione
        tempi: A ogni incarico
        indicatore: Incarichi da elenco con rotazione
        target: 100%
      - codice: H.1.2_R.1_M.2
        descrizione: Dichiarazione di assenza di conflitto di interessi da parte di chi istruisce e decide, con
          obbligo di astensione (art. 6-bis l. 241/1990, d.P.R. 62/2013)
        tipo: GENERALE
        categoria: Disciplina del conflitto di interessi
        tempi: A ogni procedimento
        indicatore: Dichiarazioni acquisite sul totale dei procedimenti
        target: 100%
      - codice: H.1.2_R.1_M.3
        descrizione: Pubblicazione dei dati sugli incarichi di collaborazione e consulenza, con curriculum e compensi,
          prima del pagamento (art. 15 d.lgs. 33/2013)
        tipo: GENERALE
        categoria: Trasparenza
        obbligo_trasparenza: ART_15
        tempi: Entro 3 mesi dal conferimento
        indicatore: Incarichi pubblicati prima della liquidazione
        target: 100%
- codice: H.2
  denominazione: Gestione del contenzioso
  descrizione: Difesa in giudizio con l'avvocatura interna o esterna, esecuzione delle sentenze
  attori_esterni: Controparti, legali
  attivita:
  - codice: H.2.1
    descrizione: Difesa in giudizio e rapporti con il legale
    rischi:
    - codice: H.2.1_R.1
      evento: Gestione negligente della difesa (termini, prove) a vantaggio della controparte
      fattore_abilitante: Scarsa responsabilizzazione interna
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio, '10': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: H.2.1_R.1_M.1
        descrizione: Registro del contenzioso con scadenze e stato delle cause, aggiornato e condiviso
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Continuativa
        indicatore: Cause registrate
        target: 100%
  - codice: H.2.2
    descrizione: Esecuzione delle sentenze e pagamento delle somme dovute
    rischi:
    - codice: H.2.2_R.1
      evento: Ritardo nel pagamento delle condanne con aggravio di interessi e spese, o pagamento non dovuto
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio, '10': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: H.2.2_R.1_M.1
        descrizione: Report periodico al RPCT con i dati del processo (numero, importi, scostamenti) per l'analisi
          delle anomalie
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Semestrale
        indicatore: Report trasmessi
        target: 2 all'anno
- codice: H.3
  denominazione: Transazioni e accordi stragiudiziali
  descrizione: Definizione delle controversie con transazione prima o durante il giudizio
  attori_esterni: Controparti
  attivita:
  - codice: H.3.1
    descrizione: Istruttoria e valutazione della convenienza della transazione
    rischi:
    - codice: H.3.1_R.1
      evento: Transazioni sfavorevoli per l'ente o non giustificate dal rischio di soccombenza
      fattore_abilitante: Mancata attuazione del principio di distinzione tra politica e amministrazione
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto,
          '10': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: H.3.1_R.1_M.1
        descrizione: Parere legale sulla convenienza e sul rischio di soccombenza, approvazione con atto motivato
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni transazione
        indicatore: Transazioni con parere
        target: 100%
      - codice: H.3.1_R.1_M.2
        descrizione: Dichiarazione di assenza di conflitto di interessi da parte di chi istruisce e decide, con
          obbligo di astensione (art. 6-bis l. 241/1990, d.P.R. 62/2013)
        tipo: GENERALE
        categoria: Disciplina del conflitto di interessi
        tempi: A ogni procedimento
        indicatore: Dichiarazioni acquisite sul totale dei procedimenti
        target: 100%
      - codice: H.3.1_R.1_M.3
        descrizione: Pubblicazione degli elenchi dei provvedimenti in Amministrazione trasparente (art. 23 d.lgs.
          33/2013)
        tipo: GENERALE
        categoria: Trasparenza
        obbligo_trasparenza: ART_23
        tempi: Semestrale
        indicatore: Provvedimenti pubblicati sul totale
        target: 100%
- codice: H.4
  denominazione: Gestione dei sinistri e dei risarcimenti
  descrizione: Richieste di risarcimento danni da parte di terzi (insidie stradali, danni a cose e persone)
  attori_esterni: Danneggiati, compagnie assicurative
  attivita:
  - codice: H.4.1
    descrizione: Istruttoria della richiesta e rapporti con l'assicurazione
    rischi:
    - codice: H.4.1_R.1
      evento: Riconoscimento di risarcimenti non dovuti o di importi gonfiati, anche in accordo con il danneggiato
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio, '10': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: H.4.1_R.1_M.1
        descrizione: Istruttoria con sopralluogo e relazione dell'ufficio tecnico, liquidazione da parte del broker
          o dell'assicurazione
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni sinistro
        indicatore: Sinistri con relazione tecnica
        target: 100%
- codice: H.5
  denominazione: Riconoscimento dei debiti fuori bilancio
  descrizione: Istruttoria e riconoscimento della legittimità dei debiti (art. 194 TUEL)
  attori_esterni: Creditori, revisore dei conti
  attivita:
  - codice: H.5.1
    descrizione: Istruttoria del debito
    rischi:
    - codice: H.5.1_R.1
      evento: Riconoscimento di debiti per acquisizioni senza impegno di spesa, per sanare affidamenti irregolari
      fattore_abilitante: Scarsa responsabilizzazione interna
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio, '10': Medio}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: H.5.1_R.1_M.1
        descrizione: Relazione del responsabile sulle cause del debito, parere del revisore e trasmissione alla
          Corte dei conti
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni riconoscimento
        indicatore: Debiti con relazione e parere
        target: 100%
