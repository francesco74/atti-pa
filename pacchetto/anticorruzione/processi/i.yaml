# Processi standard dell'area I per comuni e province. La valutazione
# di ogni rischio è una proposta: entra nei rischi nuovi e l'ente la rivede.
area: I
processi:
- codice: I.1
  ambito: COMUNE
  denominazione: Permesso di costruire
  descrizione: Rilascio del permesso di costruire, anche in deroga o convenzionato
  attori_esterni: Cittadini, imprese, professionisti tecnici
  attivita:
  - codice: I.1.1
    descrizione: Ricezione dell'istanza tramite lo sportello unico per l'edilizia
    rischi:
    - codice: I.1.1_R.1
      evento: Alterazione dell'ordine di trattazione delle pratiche o tempi diversi a seconda del richiedente o
        del professionista
      fattore_abilitante: Mancanza di trasparenza
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: I.1.1_R.1_M.1
        descrizione: Trattazione delle istanze nell'ordine cronologico di arrivo, con registro informatico tracciato
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Continuativa
        indicatore: Istanze trattate fuori ordine senza motivazione
        target: '0'
      - codice: I.1.1_R.1_M.2
        descrizione: Gestione informatizzata del procedimento (protocollo e gestionale) con tracciabilità di fasi,
          tempi e responsabili
        tipo: SPECIFICA
        categoria: Semplificazione
        tempi: Continuativa
        indicatore: Pratiche gestite sul gestionale
        target: 100%
      - codice: I.1.1_R.1_M.3
        descrizione: Monitoraggio dei tempi di conclusione dei procedimenti, con verifica degli scostamenti
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Semestrale
        indicatore: Procedimenti conclusi nei termini
        target: Almeno 95%
  - codice: I.1.2
    descrizione: Permesso di costruire
    procedimento: PRC-0038
  - codice: I.1.3
    descrizione: Istruttoria tecnica e acquisizione dei pareri
    rischi:
    - codice: I.1.3_R.1
      evento: Istruttoria compiacente o carente sulla conformità urbanistica ed edilizia, con rilascio del titolo
        in assenza dei presupposti
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte di pochi
        o di un unico soggetto
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: I.1.3_R.1_M.1
        descrizione: Lista di controllo istruttoria standard, allegata alla pratica
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni pratica
        indicatore: Pratiche con la lista di controllo compilata
        target: 100%
      - codice: I.1.3_R.1_M.2
        descrizione: Separazione tra chi istruisce e chi adotta il provvedimento, con doppia sottoscrizione
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni provvedimento
        indicatore: Provvedimenti con doppia sottoscrizione
        target: 100%
      - codice: I.1.3_R.1_M.3
        descrizione: Dichiarazione di assenza di conflitto di interessi da parte di chi istruisce e decide, con
          obbligo di astensione (art. 6-bis l. 241/1990, d.P.R. 62/2013)
        tipo: GENERALE
        categoria: Disciplina del conflitto di interessi
        tempi: A ogni procedimento
        indicatore: Dichiarazioni acquisite sul totale dei procedimenti
        target: 100%
      - codice: I.1.3_R.1_M.4
        descrizione: 'Rotazione del personale addetto o, dove non possibile, misure alternative: segregazione delle
          funzioni tra istruttoria e decisione, affiancamento, condivisione delle pratiche'
        tipo: GENERALE
        categoria: Rotazione
        tempi: Programmazione triennale
        indicatore: Processi con rotazione o segregazione delle funzioni
        target: 100% dei processi ad alto rischio
  - codice: I.1.4
    descrizione: Determinazione del contributo di costruzione e rilascio del titolo
    rischi:
    - codice: I.1.4_R.1
      evento: Calcolo del contributo di costruzione o delle sanzioni inferiore al dovuto, per agevolare il richiedente
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: I.1.4_R.1_M.1
        descrizione: Calcolo del contributo con il gestionale sulle tabelle vigenti e verifica di un secondo addetto
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni titolo
        indicatore: Calcoli verificati
        target: 100%
      - codice: I.1.4_R.1_M.2
        descrizione: Controllo successivo di regolarità amministrativa a campione sugli atti del processo (art.
          147-bis TUEL), con esiti al RPCT
        tipo: GENERALE
        categoria: Controllo
        tempi: Semestrale
        indicatore: Atti controllati sul totale
        target: Almeno 5% degli atti
