      evento: Indebite pressioni di interessi particolari sulle scelte di pianificazione, con varianti o previsioni
        che attribuiscono vantaggi a soggetti determinati
      fattore_abilitante: Mancata attuazione del principio di distinzione tra politica e amministrazione
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: L.1.1_R.1_M.1
        descrizione: Pubblicazione degli atti di pianificazione e delle proposte di trasformazione urbanistica (art.
          39 d.lgs. 33/2013)
        tipo: GENERALE
        categoria: Trasparenza
        obbligo_trasparenza: ART_39
        tempi: Prima dell'adozione
        indicatore: Atti e proposte pubblicati
        target: 100%
      - codice: L.1.1_R.1_M.2
        descrizione: Motivazione delle scelte di pianificazione e registro degli incontri con i portatori di interessi
        tipo: SPECIFICA
        categoria: Regolazione dei rapporti con i rappresentanti di interessi particolari
        tempi: Continuativa
        indicatore: Incontri registrati
        target: 100%
      - codice: L.1.1_R.1_M.3
        descrizione: Dichiarazione di assenza di conflitto di interessi da parte di chi istruisce e decide, con
          obbligo di astensione (art. 6-bis l. 241/1990, d.P.R. 62/2013)
        tipo: GENERALE
        categoria: Disciplina del conflitto di interessi
        tempi: A ogni procedimento
        indicatore: Dichiarazioni acquisite sul totale dei procedimenti
        target: 100%
  - codice: L.1.2
    descrizione: Adozione, pubblicazione e controdeduzioni alle osservazioni
    rischi:
    - codice: L.1.2_R.1
      evento: Accoglimento delle osservazioni non motivato o non coerente con gli obiettivi del piano
