# Processi standard dell'area L per comuni e province. La valutazione
# di ogni rischio è una proposta: entra nei rischi nuovi e l'ente la rivede.
area: L
processi:
- codice: L.1
  ambito: COMUNE
  denominazione: Formazione e varianti generali degli strumenti urbanistici
