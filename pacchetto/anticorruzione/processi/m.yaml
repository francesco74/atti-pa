# Processi standard dell'area M per comuni e province. La valutazione
# di ogni rischio è una proposta: entra nei rischi nuovi e l'ente la rivede.
area: M
processi:
- codice: M.1
  ambito: COMUNE
  denominazione: Affidamento e controllo del servizio di igiene urbana
  descrizione: Contratto di servizio per raccolta, trasporto e spazzamento, anche tramite l'ente di governo d'ambito
  attori_esterni: Gestore del servizio, ente di governo d'ambito
  attivita:
  - codice: M.1.1
    descrizione: Definizione del contratto di servizio e degli standard di qualità
    rischi:
    - codice: M.1.1_R.1
      evento: Standard di servizio e penali definiti in modo da non poter essere verificati
      fattore_abilitante: Inadeguatezza o assenza di competenze del personale addetto ai processi
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: M.1.1_R.1_M.1
        descrizione: Contratto di servizio con indicatori di qualità misurabili (regolazione ARERA) e penali
        tipo: SPECIFICA
        categoria: Regolamentazione
        tempi: Al rinnovo
        indicatore: Indicatori previsti nel contratto
        target: 100%
  - codice: M.1.2
    descrizione: Controllo dell'esecuzione del servizio
    rischi:
    - codice: M.1.2_R.1
      evento: Mancata verifica dei servizi resi e mancata applicazione delle penali al gestore
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: M.1.2_R.1_M.1
        descrizione: Verifiche a campione sul territorio e sui dati di servizio (tracciamento dei mezzi, pesate)
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Mensile
        indicatore: Controlli effettuati
        target: Almeno mensile
      - codice: M.1.2_R.1_M.2
        descrizione: Report periodico al RPCT con i dati del processo (numero, importi, scostamenti) per l'analisi
          delle anomalie
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Semestrale
        indicatore: Report trasmessi
        target: 2 all'anno
- codice: M.2
  ambito: COMUNE
  denominazione: Piano economico finanziario e tariffe della TARI
  descrizione: Predisposizione e validazione del PEF secondo il metodo ARERA e approvazione delle tariffe
  attori_esterni: Gestore, ente di governo d'ambito, ARERA
  attivita:
  - codice: M.2.1
    descrizione: Raccolta dei dati di costo e validazione del piano
    rischi:
    - codice: M.2.1_R.1
      evento: Costi del gestore inseriti nel piano senza verifica, con aumenti tariffari a carico degli utenti
      fattore_abilitante: Inadeguatezza o assenza di competenze del personale addetto ai processi
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: M.2.1_R.1_M.1
        descrizione: Validazione del PEF da soggetto terzo rispetto al gestore
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Annuale
        indicatore: PEF validati
        target: 100%
- codice: M.3
  ambito: COMUNE
  denominazione: Gestione dei centri di raccolta e dei conferimenti
  descrizione: Accesso ai centri di raccolta, pesature e riduzioni tariffarie collegate
  attori_esterni: Utenti, gestore
  attivita:
  - codice: M.3.1
    descrizione: Registrazione dei conferimenti
    rischi:
    - codice: M.3.1_R.1
      evento: Registrazione di conferimenti fittizi per ottenere riduzioni della tariffa o accettazione di rifiuti
        di imprese non ammessi
      fattore_abilitante: Mancanza di misure di trattamento del rischio e/o controlli
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: M.3.1_R.1_M.1
        descrizione: Registrazione informatica dei conferimenti con tessera dell'utente e controlli a campione
        tipo: SPECIFICA
        categoria: Controllo
        tempi: Continuativa
        indicatore: Conferimenti registrati
        target: 100%
- codice: M.4
  ambito: COMUNE
  denominazione: Rimozione dei rifiuti abbandonati e bonifiche
  descrizione: Ordinanze di rimozione e smaltimento, bonifica dei siti inquinati
  attori_esterni: Proprietari delle aree, ARPA
  attivita:
  - codice: M.4.1
    descrizione: Ordinanza di rimozione e individuazione dell'obbligato
    rischi:
    - codice: M.4.1_R.1
      evento: Rimozione a carico dell'ente senza rivalsa sul responsabile individuato
      fattore_abilitante: Scarsa responsabilizzazione interna
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: M.4.1_R.1_M.1
        descrizione: Motivazione puntuale del provvedimento, con richiamo dei presupposti e dei criteri applicati
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni provvedimento
        indicatore: Provvedimenti con motivazione completa ai controlli successivi
        target: 100%
      - codice: M.4.1_R.1_M.2
        descrizione: Avvio dell'azione di rivalsa per le spese di rimozione e bonifica
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni intervento
        indicatore: Rivalse avviate
        target: 100% dei casi con responsabile
  - codice: M.4.2
    descrizione: Affidamento degli interventi di rimozione e bonifica
    rischi:
    - codice: M.4.2_R.1
      evento: Affidamenti diretti ricorrenti in urgenza per interventi programmabili
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte di pochi
        o di un unico soggetto
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: M.4.2_R.1_M.1
        descrizione: Rispetto del principio di rotazione degli affidamenti e degli inviti (art. 49 d.lgs. 36/2023),
          con registro degli operatori affidatari
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni affidamento
        indicatore: Affidamenti al contraente uscente motivati
        target: 100%
      - codice: M.4.2_R.1_M.2
        descrizione: Programmazione triennale e aggiornamento annuale degli acquisti e dei lavori, con verifica
          degli acquisti fuori programma
        tipo: SPECIFICA
        categoria: Regolamentazione
        tempi: Annuale
        indicatore: Acquisti non programmati sul totale
        target: ≤ 10%
- codice: M.5
  ambito: PROVINCIA
  denominazione: Iscrizioni e autorizzazioni per il recupero e lo smaltimento dei rifiuti
  descrizione: Procedure semplificate di recupero e autorizzazioni agli impianti dove delegate alla provincia
  attori_esterni: Imprese di gestione dei rifiuti, ARPA
  attivita:
  - codice: M.5.1
    descrizione: Iscrizione nel registro delle imprese che recuperano rifiuti in procedura semplificata
    procedimento: PRC-0048
  - codice: M.5.2
    descrizione: Autorizzazione unica per impianti di smaltimento e recupero dei rifiuti (ove delegata)
    procedimento: PRC-0049
  - codice: M.5.3
    descrizione: Istruttoria e prescrizioni
    rischi:
    - codice: M.5.3_R.1
      evento: Istruttoria compiacente sui requisiti tecnici degli impianti e sulle garanzie finanziarie
      fattore_abilitante: Inadeguatezza o assenza di competenze del personale addetto ai processi
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: M.5.3_R.1_M.1
        descrizione: Lista di controllo istruttoria standard, allegata alla pratica
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni pratica
        indicatore: Pratiche con la lista di controllo compilata
        target: 100%
      - codice: M.5.3_R.1_M.2
        descrizione: Dichiarazione di assenza di conflitto di interessi da parte di chi istruisce e decide, con
          obbligo di astensione (art. 6-bis l. 241/1990, d.P.R. 62/2013)
        tipo: GENERALE
        categoria: Disciplina del conflitto di interessi
        tempi: A ogni procedimento
        indicatore: Dichiarazioni acquisite sul totale dei procedimenti
        target: 100%
      - codice: M.5.3_R.1_M.3
        descrizione: Verifica delle garanzie finanziarie presso l'emittente
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni autorizzazione
        indicatore: Garanzie verificate
        target: 100%
- codice: M.6
  ambito: PROVINCIA
  denominazione: Controlli sugli impianti di gestione dei rifiuti
  descrizione: Ispezioni sugli impianti autorizzati o iscritti
  attori_esterni: Imprese, ARPA
  attivita:
  - codice: M.6.1
    descrizione: Programmazione ed esecuzione delle ispezioni
    rischi:
    - codice: M.6.1_R.1
      evento: Ispezioni preannunciate o compiacenti, mancata contestazione delle violazioni
      fattore_abilitante: Esercizio prolungato ed esclusivo della responsabilità di un processo da parte di pochi
        o di un unico soggetto
      valutazione:
        probabilita: {'1': Alto, '2': Alto, '3': Alto, '4': Alto, '5': Alto, '6': Alto, '7': Alto, '8': Alto, '9': Alto}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: M.6.1_R.1_M.1
        descrizione: Sopralluoghi svolti da almeno due addetti, con verbale e documentazione fotografica
        tipo: SPECIFICA
        categoria: Controllo
        tempi: A ogni sopralluogo
        indicatore: Sopralluoghi con verbale congiunto
        target: 100%
      - codice: M.6.1_R.1_M.2
        descrizione: 'Rotazione del personale addetto o, dove non possibile, misure alternative: segregazione delle
          funzioni tra istruttoria e decisione, affiancamento, condivisione delle pratiche'
        tipo: GENERALE
        categoria: Rotazione
        tempi: Programmazione triennale
        indicatore: Processi con rotazione o segregazione delle funzioni
        target: 100% dei processi ad alto rischio
      - codice: M.6.1_R.1_M.3
        descrizione: Rispetto del codice di comportamento dell'ente, con le regole specifiche per chi opera nel
          processo
        tipo: GENERALE
        categoria: Definizione e promozione dell'etica e di standard di comportamento
        tempi: Annuale
        indicatore: Violazioni accertate e procedimenti disciplinari avviati
        target: Monitoraggio annuale
