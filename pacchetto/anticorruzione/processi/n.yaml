      valutazione:
        probabilita: {'1': Basso, '2': Basso, '3': Basso, '4': Basso, '5': Basso, '6': Basso, '7': Basso, '8': Basso,
          '9': Basso, '10': Basso}
        impatto: {'1': Basso, '2': Basso, '3': Basso, '4': Basso}
      misure:
      - codice: N.3.2_R.1_M.1
        descrizione: Metodologia dell'indagine predefinita e pubblicazione dei risultati
        tipo: SPECIFICA
        categoria: Trasparenza
