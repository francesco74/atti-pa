          '9': Medio, '10': Medio}
        impatto: {'1': Medio, '2': Medio, '3': Medio, '4': Medio}
      misure:
      - codice: N.3.1_R.1_M.1
        descrizione: Registro informatico dei reclami con termini di risposta, trasmesso periodicamente al RPCT
