- codice: N.5
  denominazione: Sistemi informativi e sito istituzionale
  descrizione: Infrastruttura informatica, applicazioni, sicurezza, backup e sito istituzionale
  attori_esterni: Fornitori ICT, cittadini
  attivita:
  - codice: N.5.1
    descrizione: Acquisizione di hardware, software e servizi cloud
    rischi:
    - codice: N.5.1_R.1
      evento: Scelta di fornitori e soluzioni che vincolano a un unico operatore o requisiti costruiti su un prodotto
      fattore_abilitante: Inadeguatezza o assenza di competenze del personale addetto ai processi
      valutazione:
        probabilita: {'1': Medio, '2': Medio, '3': Medio, '4': Medio, '5': Medio, '6': Medio, '7': Medio, '8': Medio,
          '9': Medio, '10': Medio}
        impatto: {'1': Alto, '2': Alto, '3': Alto, '4': Alto}
      misure:
      - codice: N.5.1_R.1_M.1
