# Modello: determina di conferimento di incarico di patrocinio legale con impegno di spesa.
#
# - Il patrocinio in giudizio di un avvocato è un servizio legale escluso dal Codice dei
#   contratti (art. 56, comma 1, lett. h), D.Lgs. 36/2023): non si svolge una gara, ma
#   l'affidamento rispetta i principi degli artt. 1, 2 e 3 (art. 13, comma 5). Resta un
#   contratto pubblico: CIG, tracciabilità dei flussi (L. 136/2010) e trasparenza si
#   applicano (Consiglio di Stato, sez. V, n. 2776/2025).
# - Prima dell'incarico l'organo competente secondo lo statuto (di norma la Giunta o il
#   Sindaco) autorizza l'ente a promuovere o resistere in giudizio.
# - Il compenso è determinato sui parametri forensi (D.M. 10 marzo 2014, n. 55, aggiornato
#   dal D.M. 13 agosto 2022, n. 147) ed è equo (L. 49/2023); l'avvocato ha la polizza
#   professionale obbligatoria (art. 12 L. 247/2012) e dichiara l'assenza di conflitti di
#   interessi e incompatibilità.
# - Ricorso: 60 giorni. Il rito abbreviato dell'art. 119, comma 1, lett. a), c.p.a.
#   dimezza i termini processuali ma non quello del ricorso introduttivo (comma 2); il
#   termine di 30 giorni dell'art. 120 riguarda le procedure disciplinate dal Codice dei
#   contratti, mentre il patrocinio è un servizio escluso.
#
# CHECKLIST CORRISPONDENTI (pacchetto/checklist)
#   scheda_determine.json            generica, per ogni determinazione
#   scheda_patrocinio_legale.json    di questo modello

codice: DD_INCARICO_PATROCINIO_LEGALE
versione: 1
titolo: Determina di conferimento di incarico di patrocinio legale
descrizione: >-
  Incarico a un avvocato per la difesa dell'ente in un giudizio (servizio legale escluso,
  art. 56 D.Lgs. 36/2023), con disciplinare e impegno di spesa.
tipologia_atto: DETERMINA
provvedimento: Determinazione dirigenziale
organo: Dirigente
formula_dispositivo: DETERMINA

domande:
  - id: posizione
    testo: L'ente promuove il giudizio o vi resiste?
    tipo: scelta
    opzioni:
      promuovere: Promuove il giudizio (ricorrente o attore)
      resistere: Resiste in giudizio (resistente o convenuto)
      impugnare: Impugna una sentenza

  - id: autorizzazione
    testo: Con quale atto l'ente è stato autorizzato a stare in giudizio?
    tipo: scelta
    opzioni:
      giunta: Delibera di Giunta
      sindaco: Decreto o atto del Sindaco
      altro: Altro atto previsto dallo statuto
    aiuto: >-
      La competenza a decidere di promuovere o resistere in giudizio è fissata dallo statuto
      dell'ente; la determina conferisce poi l'incarico all'avvocato.

  - id: scelta_avvocato
    testo: Come è stato scelto l'avvocato?
    tipo: scelta
    opzioni:
      elenco: Dall'elenco degli avvocati dell'ente, nel rispetto della rotazione
      preventivi: Con il confronto di più preventivi
      motivata: Scelta diretta motivata (specifica competenza, continuità con un giudizio connesso)
    aiuto: >-
      L'incarico rispetta i principi di risultato, fiducia e accesso al mercato (artt. 1-3
      D.Lgs. 36/2023): trasparenza, rotazione, competenza dell'avvocato per la materia.

  - id: importo
    testo: Compenso concordato, al netto di spese generali, contributo previdenziale e IVA
    tipo: importo

derivati:
  posizione_testo:
    - {se: posizione == "promuovere", valore: promuovere il giudizio}
    - {se: posizione == "resistere", valore: resistere nel giudizio}
    - {valore: proporre impugnazione}
  contributo_anac: importo >= 40000

campi:
  ente: {etichetta: Ente, tipo: testo, fonte: ente}
  settore: {etichetta: Settore, tipo: testo, fonte: profilo}
  numero_atto: {etichetta: Numero della determina, tipo: testo, fonte: sistema, obbligatorio: false}
  data_atto: {etichetta: Data della determina, tipo: data, fonte: sistema, obbligatorio: false}
  cig: {etichetta: CIG, tipo: cig, aiuto: "Acquisito tramite piattaforma certificata o, sotto i 5.000 euro, con l'interfaccia web della PCP di ANAC."}
  decreto_incarico:
    etichetta: Decreto di conferimento dell'incarico dirigenziale (numero e data)
    tipo: testo
    fonte: profilo
  giudizio:
    etichetta: Giudizio (autorità giudiziaria e oggetto)
    tipo: testo_lungo
    aiuto: >-
      Es. "ricorso al TAR Toscana per l'annullamento del provvedimento n. ...". Non indicare
      dati personali della controparte persona fisica: basta un riferimento al numero di
      ruolo o all'atto impugnato.
  atto_autorizzazione: {etichetta: Atto di autorizzazione a stare in giudizio (estremi), tipo: testo}
  avvocato: {etichetta: Avvocato incaricato, tipo: testo}
  avvocato_cf_piva: {etichetta: Codice fiscale o partita IVA dell'avvocato, tipo: codice_fiscale_piva}
  foro: {etichetta: Ordine degli avvocati di iscrizione, tipo: testo}
  motivazione_scelta:
    etichetta: Motivazione della scelta dell'avvocato
    tipo: testo_lungo
    aiuto: Competenza nella materia del giudizio (curriculum), posizione nell'elenco, esito del confronto dei preventivi.
  parametri_forensi:
    etichetta: Confronto del compenso con i parametri forensi
    tipo: testo_lungo
    aiuto: >-
      Valore della causa, scaglione e fasi del giudizio secondo il D.M. 55/2014 (aggiornato
      dal D.M. 147/2022): il compenso concordato deve essere equo (L. 49/2023).
  polizza_rc: {etichetta: "Polizza professionale dell'avvocato (compagnia, numero, massimale)", tipo: testo}
  importo_totale: {etichetta: "Importo complessivo dell'incarico (euro, con spese generali, CPA e IVA)", tipo: importo}
  impegni:
    etichetta: Impegni di spesa
    tipo: elenco
    minimo: 1
    sottocampi:
      importo: {etichetta: "Importo (euro)", tipo: importo}
      capitolo: {etichetta: Capitolo, tipo: testo}
      descrizione: {etichetta: Descrizione del capitolo, tipo: testo}
      missione: {etichetta: Missione, tipo: testo}
      programma: {etichetta: Programma, tipo: testo}
      bilancio: {etichetta: Bilancio (esercizio), tipo: testo}
  contributo_anac_importo: {etichetta: "Contributo ANAC (euro)", tipo: importo}
  contributo_anac_capitolo: {etichetta: Capitolo del contributo ANAC, tipo: testo}
  contributo_anac_bilancio: {etichetta: Bilancio del contributo ANAC, tipo: testo}
  rup: {etichetta: Responsabile del procedimento, tipo: testo, fonte: profilo}
  fascicolo: {etichetta: Fascicolo informatico del procedimento, tipo: testo, obbligatorio: false}
  url_trasparenza: {etichetta: Indirizzo di Amministrazione trasparente, tipo: testo, fonte: ente}
  sezione_tar: {etichetta: Sezione del TAR competente, tipo: testo, fonte: ente}
  luogo: {etichetta: Luogo, tipo: testo, fonte: ente}
  data_adozione: {etichetta: Data di adozione, tipo: data}
  firmatario: {etichetta: Dirigente firmatario, tipo: testo, fonte: profilo}

fasi:
  - numero: 1
    titolo: Intestazione e identificazione dell'atto
    sezioni:
      - titolo: Intestazione
        capoversi:
          - id: intestazione
            modificabile: false
            testo: |-
              {{ente}}
              Settore {{settore}}
              Determinazione dirigenziale n. {{numero_atto}} del {{data_atto}}
      - titolo: Oggetto
        oggetto: true
        capoversi:
          - id: oggetto
            testo: >-
              Codice CIG: {{cig}} - Conferimento dell'incarico di patrocinio legale all'avv.
              {{avvocato}} per {{posizione_testo}}: {{giudizio}}. Impegno di spesa.
      - titolo: Organo
        capoversi:
          - id: organo
            modificabile: false
            testo: IL DIRIGENTE DEL SETTORE {{settore}}

  - numero: 2
    titolo: Preambolo e motivazione
    sezioni:
      - titolo: Competenza
        capoversi:
          - id: competenza
            norme: ["urn:nir:stato:decreto.legislativo:2000-08-18;267~art107"]
            testo: >-
              Visto il decreto {{decreto_incarico}}, con il quale è stato conferito al
              sottoscritto l'incarico di direzione del Settore {{settore}}, con le funzioni di
              cui all'art. 107 del D.Lgs. 267/2000;

      - titolo: Presupposti
        capoversi:
          - id: autorizzazione
            testo: >-
              Visto l'atto {{atto_autorizzazione}}, con il quale l'ente è stato autorizzato a
              {{posizione_testo}} {{giudizio}} e il dirigente competente è stato incaricato di
              individuare il legale cui conferire il patrocinio;
          - id: necessita_legale
            testo: >-
              Considerato che l'ente non dispone di un'avvocatura interna e che è pertanto
              necessario affidare la difesa a un avvocato del libero foro;

      - titolo: Quadro normativo
        formula: Visti
        riferimenti_libreria: true
        capoversi:
          - id: visto_art56
            norme:
              - "urn:nir:stato:decreto.legislativo:2023-03-31;36~art56"
              - "urn:nir:stato:decreto.legislativo:2023-03-31;36~art13"
            testo: >-
              l'art. 56, comma 1, lett. h), del D.Lgs. 36/2023, che esclude dall'applicazione
              del Codice dei contratti i servizi legali di rappresentanza in giudizio, e l'art.
              13, comma 5, del medesimo decreto, per il quale il loro affidamento avviene nel
              rispetto dei principi di cui agli articoli 1, 2 e 3;
          - id: visto_parametri
            testo: >-
              il D.M. 10 marzo 2014, n. 55, come aggiornato dal D.M. 13 agosto 2022, n. 147,
              recante i parametri per la liquidazione dei compensi per la professione forense;
          - id: visto_equo_compenso
            testo: la legge 21 aprile 2023, n. 49, in materia di equo compenso delle prestazioni professionali;
          - id: visto_ordinamento_forense
            testo: la legge 31 dicembre 2012, n. 247, recante la nuova disciplina dell'ordinamento della professione forense;
          - id: visto_tuel
            testo: il D.Lgs. 18 agosto 2000, n. 267 (Testo Unico degli Enti Locali);

      - titolo: Scelta dell'avvocato
        capoversi:
          - id: scelta_elenco
            se: scelta_avvocato == "elenco"
            testo: >-
              Dato atto che l'avv. {{avvocato}}, del Foro di {{foro}}, è stato individuato
              nell'elenco degli avvocati per il conferimento di incarichi dell'ente, nel
              rispetto del principio di rotazione, in quanto {{motivazione_scelta}};
          - id: scelta_preventivi
            se: scelta_avvocato == "preventivi"
            testo: >-
              Dato atto che, a seguito del confronto tra più preventivi, l'avv. {{avvocato}},
              del Foro di {{foro}}, è stato individuato in quanto {{motivazione_scelta}};
          - id: scelta_motivata
            se: scelta_avvocato == "motivata"
            testo: >-
              Dato atto che l'avv. {{avvocato}}, del Foro di {{foro}}, è stato individuato in
              considerazione della specifica competenza nella materia del giudizio, risultante
              dal curriculum acquisito agli atti, in quanto {{motivazione_scelta}};
          - id: compenso
            fonte: aggiunto
            testo: >-
              Dato atto che il compenso concordato, pari a euro {{importo}} oltre spese generali,
              contributo previdenziale e IVA, per complessivi euro {{importo_totale}}, è congruo
              rispetto ai parametri forensi e rispettoso dell'equo compenso: {{parametri_forensi}};
          - id: dichiarazioni_avvocato
            fonte: aggiunto
            testo: >-
              Dato atto che l'avvocato ha dichiarato l'assenza di situazioni di conflitto di
              interessi e di incompatibilità con l'incarico, anche ai sensi del codice
              deontologico forense, ed è in possesso della polizza di assicurazione per la
              responsabilità civile professionale prevista dall'art. 12 della L. 247/2012
              ({{polizza_rc}});
          - id: conflitto_interessi
            fonte: aggiunto
            testo: >-
              Dato atto che non sussistono situazioni di conflitto di interessi, anche
              potenziale, in capo al sottoscritto e al responsabile del procedimento, ai sensi
              dell'art. 6-bis della L. 241/1990;
          - id: cig
            testo: >-
              Dato atto che per l'incarico è stato acquisito il CIG {{cig}} e che si applicano gli
              obblighi di tracciabilità dei flussi finanziari di cui alla L. 136/2010;

  - numero: 3
    titolo: Dispositivo
    formula: DETERMINA
    premessa: >-
      per quanto esposto in narrativa che forma parte integrante e sostanziale del presente
      provvedimento:
    numerazione: automatica
    sezioni:
      - titolo: Decisione
        capoversi:
          - id: d_incarico
            testo: >-
              di conferire all'avv. {{avvocato}} (C.F./P.IVA {{avvocato_cf_piva}}), del Foro di
              {{foro}}, l'incarico di patrocinio legale dell'ente per {{posizione_testo}}
              {{giudizio}}, per il compenso di euro {{importo}} oltre spese generali,
              contributo previdenziale e IVA;
          - id: d_disciplinare
            testo: >-
              di approvare il disciplinare d'incarico, che regola le prestazioni, il compenso,
              le modalità di pagamento, gli obblighi di informazione sull'andamento del
              giudizio e la riservatezza, e di disporne la sottoscrizione;
      - titolo: Impegno di spesa
        capoversi:
          - id: d_impegno
            ripeti_per: impegni
            testo: >-
              di impegnare la somma di euro {{impegni.importo}} sul cap. {{impegni.capitolo}};
              descrizione {{impegni.descrizione}}; missione {{impegni.missione}}; programma
              {{impegni.programma}}; bilancio {{impegni.bilancio}};
          - id: d_anac
            se: contributo_anac
            testo: >-
              di impegnare il contributo dovuto ad ANAC, pari a euro {{contributo_anac_importo}},
              sul cap. {{contributo_anac_capitolo}} del bilancio {{contributo_anac_bilancio}};
          - id: d_183
            norme: ["urn:nir:stato:decreto.legislativo:2000-08-18;267~art183"]
            testo: >-
              di dare atto che il presente atto diviene esecutivo con l'apposizione del visto di
              regolarità contabile attestante la copertura finanziaria ai sensi dell'art. 183,
              comma 7, del D.Lgs. 267/2000;
          - id: d_regolarita
            testo: di attestare la regolarità e la correttezza del presente atto ai sensi dell'art. 147-bis del D.Lgs. 267/2000;
      - titolo: Pubblicità e trasparenza
        capoversi:
          - id: d_responsabile
            testo: di dare atto che il responsabile del procedimento è {{rup}};
          - id: d_fascicolo
            norme: ["urn:nir:stato:decreto.legislativo:2005-03-07;82~art41"]
            testo: >-
              di dare atto che gli atti e i documenti del procedimento sono conservati nel
              fascicolo informatico {{fascicolo}}, ai sensi dell'art. 41 del D.Lgs. 82/2005;
          - id: d_trasparenza
            testo: >-
              di disporre la pubblicazione del presente provvedimento all'Albo pretorio e nella
              sezione "Amministrazione trasparente" all'indirizzo {{url_trasparenza}}, ai sensi
              del D.Lgs. 33/2013, omettendo i dati personali non necessari;
          - id: d_ricorso
            modificabile: false
            testo: >-
              di dare atto che avverso il presente provvedimento è ammesso ricorso al Tribunale
              amministrativo regionale (TAR), sezione di {{sezione_tar}}, entro 60 giorni dalla
              pubblicazione, o ricorso straordinario al Presidente della Repubblica entro 120
              giorni.

  - numero: 4
    titolo: Luogo, data e sottoscrizione
    sezioni:
      - titolo: Chiusura
        capoversi:
          - id: luogo_data
            testo: "{{luogo}}, {{data_adozione}}"
          - id: firma
            modificabile: false
            testo: |-
              Il Dirigente
              {{firmatario}}
