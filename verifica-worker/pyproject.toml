[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifica-worker"
version = "0.1.0"
description = "Worker che esegue le verifiche degli atti (riferimenti, checklist con LLM)"
requires-python = ">=3.11"
dependencies = ["atti-common"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
